<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1976d2">
<title>环卫AI平台·移动端</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { width:100%; height:100%; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif; font-size:14px; color:#333; background:#f5f6fa; user-select:none; -webkit-user-select:none; }
#app { width:100%; height:100%; display:flex; flex-direction:column; }

/* 登录页 */
.login { width:100%; height:100%; background:linear-gradient(160deg,#1976d2 0%,#42a5f5 55%,#90caf9 100%); display:flex; flex-direction:column; align-items:center; padding:60px 24px 24px; color:#fff; overflow-y:auto; }
.login-logo { width:80px; height:80px; border-radius:20px; background:rgba(255,255,255,.2); backdrop-filter:blur(10px); display:flex; align-items:center; justify-content:center; font-size:40px; margin-bottom:16px; }
.login-title { font-size:22px; font-weight:600; margin-bottom:6px; }
.login-sub { font-size:13px; opacity:.85; margin-bottom:32px; }
.login-card { width:100%; max-width:360px; background:#fff; border-radius:16px; padding:20px; color:#333; box-shadow:0 8px 30px rgba(0,0,0,.15); }
.login-card h3 { font-size:15px; margin-bottom:14px; color:#1976d2; }
.lg-field { margin-bottom:12px; }
.lg-field label { display:block; font-size:12px; color:#666; margin-bottom:6px; }
.lg-field select, .lg-field input { width:100%; padding:11px 12px; border:1px solid #e0e0e0; border-radius:10px; font-size:14px; background:#fafafa; outline:none; }
.lg-field select:focus, .lg-field input:focus { border-color:#1976d2; background:#fff; }
.lg-btn { width:100%; padding:13px; background:linear-gradient(135deg,#1976d2,#42a5f5); color:#fff; border:none; border-radius:10px; font-size:15px; font-weight:600; margin-top:6px; cursor:pointer; }
.lg-btn:active { opacity:.85; }
.lg-tip { font-size:11px; color:#999; text-align:center; margin-top:10px; line-height:1.6; }
.lg-input-wrap { position:relative; display:flex; align-items:center; }
.lg-input-wrap .lg-ico { position:absolute; left:12px; font-size:14px; color:#999; pointer-events:none; }
.lg-input-wrap input { width:100%; padding:11px 40px 11px 36px !important; border:1px solid #e0e0e0; border-radius:10px; font-size:14px; background:#fafafa; outline:none; }
.lg-input-wrap input:focus { border-color:#1976d2; background:#fff; }
.lg-eye { position:absolute; right:10px; font-size:16px; cursor:pointer; padding:4px 6px; color:#999; user-select:none; }
.lg-row { display:flex; justify-content:space-between; align-items:center; margin:4px 0 12px; }
.lg-check { display:flex; align-items:center; gap:6px; font-size:12px; color:#666; cursor:pointer; }
.lg-check input { width:14px; height:14px; accent-color:#1976d2; }
.lg-link { font-size:12px; color:#1976d2; text-decoration:none; }
.lg-link:active { opacity:.6; }
.demo-box { margin-top:14px; padding-top:12px; border-top:1px dashed #e0e0e0; }
.demo-title { font-size:12px; color:#666; text-align:center; cursor:pointer; user-select:none; display:flex; align-items:center; justify-content:center; gap:4px; }
.demo-title span { color:#999; font-size:10px; }
.demo-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; justify-content:center; }
.demo-chip { padding:6px 9px; background:#f5f7fa; border:1px solid #e0e6ee; border-radius:8px; font-size:10.5px; color:#555; cursor:pointer; text-align:center; line-height:1.4; min-width:80px; }
.demo-chip code { display:block; font-family:monospace; font-size:10px; color:#1976d2; margin-top:2px; }
.demo-chip:active { background:#e3f2fd; border-color:#90caf9; }
.demo-tip { font-size:10.5px; color:#999; text-align:center; margin-top:8px; }
.demo-tip code { background:#f5f5f5; padding:1px 4px; border-radius:3px; color:#d32f2f; font-family:monospace; }
.role-pills { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.role-pill { flex:1; min-width:70px; padding:9px 6px; background:#f0f4fa; border:1.5px solid transparent; border-radius:10px; font-size:12px; text-align:center; cursor:pointer; color:#666; }
.role-pill.active { background:#e3f2fd; border-color:#1976d2; color:#1976d2; font-weight:600; }
.dept-row { display:flex; flex-wrap:wrap; gap:6px; }
.dept-pill { padding:5px 10px; background:#f0f2f5; border-radius:12px; font-size:11.5px; color:#666; cursor:pointer; border:1px solid transparent; }
.dept-pill.active { background:#e3f2fd; color:#1976d2; border-color:#90caf9; font-weight:600; }
#lg-user[size] { padding:6px; }
#lg-user[size] option { padding:8px 6px; border-radius:6px; margin-bottom:2px; }
#lg-user[size] option:checked { background:linear-gradient(0deg,#e3f2fd,#e3f2fd); color:#1976d2; font-weight:600; }

/* 主界面 */
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.header { background:linear-gradient(135deg,#1976d2,#42a5f5); color:#fff; padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 8px rgba(25,118,210,.2); z-index:10; }
.hdr-left { display:flex; align-items:center; gap:10px; }
.avatar { width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.25); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; border:1.5px solid rgba(255,255,255,.5); }
.hdr-title { font-size:15px; font-weight:600; line-height:1.2; }
.hdr-sub { font-size:11px; opacity:.85; margin-top:2px; }
.hdr-right { display:flex; gap:12px; font-size:18px; }
.hdr-icon { cursor:pointer; position:relative; }
.badge { position:absolute; top:-4px; right:-6px; background:#ff5252; color:#fff; font-size:9px; padding:1px 5px; border-radius:8px; font-weight:600; min-width:16px; text-align:center; }

.content { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:12px 12px 16px; }

.tabbar { background:#fff; display:flex; border-top:1px solid #ececec; padding:6px 0 calc(env(safe-area-inset-bottom,0px) + 6px); box-shadow:0 -2px 8px rgba(0,0,0,.03); }
.tab { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:4px; cursor:pointer; color:#999; font-size:10px; }
.tab.active { color:#1976d2; }
.tab-ico { font-size:20px; line-height:1; }

/* 通用卡片 */
.card { background:#fff; border-radius:12px; padding:14px; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,.04); }
.card-hdr { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.card-title { font-size:14px; font-weight:600; color:#222; }
.card-title::before { content:''; display:inline-block; width:3px; height:12px; background:#1976d2; border-radius:2px; margin-right:6px; vertical-align:middle; }
.card-more { font-size:12px; color:#1976d2; cursor:pointer; }

.stat-row { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.stat-cell { background:linear-gradient(135deg,#f0f7ff,#e3f2fd); border-radius:10px; padding:10px 6px; text-align:center; }
.stat-cell.orange { background:linear-gradient(135deg,#fff8e1,#ffecb3); }
.stat-cell.green { background:linear-gradient(135deg,#e8f5e9,#c8e6c9); }
.stat-cell.red { background:linear-gradient(135deg,#ffebee,#ffcdd2); }
.stat-num { font-size:18px; font-weight:700; color:#1976d2; line-height:1.2; }
.stat-cell.orange .stat-num { color:#f57c00; }
.stat-cell.green .stat-num { color:#2e7d32; }
.stat-cell.red .stat-num { color:#c62828; }
.stat-lbl { font-size:10px; color:#666; margin-top:2px; }

.quick-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.quick-item { display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px 4px; cursor:pointer; border-radius:8px; }
.quick-item:active { background:#f5f5f5; }
.quick-ico { width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px; color:#fff; }
.quick-lbl { font-size:11px; color:#555; }
.qi-blue { background:linear-gradient(135deg,#42a5f5,#1976d2); }
.qi-green { background:linear-gradient(135deg,#66bb6a,#2e7d32); }
.qi-orange { background:linear-gradient(135deg,#ffa726,#ef6c00); }
.qi-red { background:linear-gradient(135deg,#ef5350,#c62828); }
.qi-purple { background:linear-gradient(135deg,#ab47bc,#6a1b9a); }
.qi-cyan { background:linear-gradient(135deg,#26c6da,#00838f); }
.qi-brown { background:linear-gradient(135deg,#8d6e63,#4e342e); }
.qi-gray { background:linear-gradient(135deg,#78909c,#37474f); }

.list-item { display:flex; align-items:center; padding:12px 0; border-bottom:1px solid #f2f2f2; gap:10px; cursor:pointer; }
.list-item:last-child { border-bottom:none; }
.li-ico { width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; color:#fff; flex-shrink:0; }
.li-body { flex:1; min-width:0; }
.li-title { font-size:13.5px; color:#222; font-weight:500; margin-bottom:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.li-desc { font-size:11.5px; color:#888; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.li-right { text-align:right; font-size:11px; color:#999; flex-shrink:0; }
.li-tag { display:inline-block; padding:2px 8px; border-radius:8px; font-size:10px; margin-bottom:2px; }
.tag-red { background:#ffebee; color:#c62828; }
.tag-orange { background:#fff3e0; color:#ef6c00; }
.tag-green { background:#e8f5e9; color:#2e7d32; }
.tag-blue { background:#e3f2fd; color:#1976d2; }
.tag-gray { background:#f5f5f5; color:#666; }
.tag-purple { background:#f3e5f5; color:#6a1b9a; }

.btn { padding:9px 16px; border-radius:8px; border:none; font-size:13px; cursor:pointer; font-weight:500; }
.btn-primary { background:#1976d2; color:#fff; }
.btn-primary:active { background:#1565c0; }
.btn-default { background:#f5f5f5; color:#555; }
.btn-danger { background:#ffebee; color:#c62828; }
.btn-success { background:#e8f5e9; color:#2e7d32; }
.btn-block { width:100%; padding:12px; font-size:14px; }
.btn-row { display:flex; gap:8px; }
.btn-row .btn { flex:1; }

.checkin-hero { background:linear-gradient(135deg,#1976d2,#42a5f5); border-radius:16px; padding:20px; color:#fff; text-align:center; margin-bottom:12px; box-shadow:0 4px 16px rgba(25,118,210,.3); }
.ch-time { font-size:32px; font-weight:300; letter-spacing:1px; margin-bottom:2px; }
.ch-date { font-size:11.5px; opacity:.9; margin-bottom:16px; }
.ch-btn { width:110px; height:110px; border-radius:50%; background:rgba(255,255,255,.2); border:3px solid rgba(255,255,255,.6); color:#fff; font-size:15px; font-weight:600; cursor:pointer; margin:0 auto; display:flex; align-items:center; justify-content:center; flex-direction:column; backdrop-filter:blur(10px); }
.ch-btn:active { transform:scale(.95); }
.ch-btn.done { background:#4caf50; border-color:#81c784; }
.ch-status { font-size:11.5px; opacity:.9; margin-top:12px; }
.ch-loc { font-size:10.5px; opacity:.75; margin-top:4px; }

.progress-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:12px; }
.progress-row:last-child { margin-bottom:0; }
.pr-label { width:70px; color:#666; flex-shrink:0; }
.pr-bar { flex:1; height:6px; background:#f0f0f0; border-radius:3px; overflow:hidden; }
.pr-fill { height:100%; background:linear-gradient(90deg,#42a5f5,#1976d2); border-radius:3px; transition:width .3s; }
.pr-fill.green { background:linear-gradient(90deg,#66bb6a,#2e7d32); }
.pr-fill.orange { background:linear-gradient(90deg,#ffa726,#ef6c00); }
.pr-fill.red { background:linear-gradient(90deg,#ef5350,#c62828); }
.pr-val { width:44px; text-align:right; color:#333; font-weight:500; flex-shrink:0; }

.segment { display:flex; background:#f0f2f5; border-radius:10px; padding:3px; margin-bottom:12px; }
.seg-item { flex:1; padding:7px 8px; text-align:center; font-size:12.5px; color:#666; cursor:pointer; border-radius:8px; transition:all .2s; }
.seg-item.active { background:#fff; color:#1976d2; font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.06); }

.empty { text-align:center; padding:40px 20px; color:#bbb; font-size:12.5px; }
.empty-ico { font-size:40px; margin-bottom:8px; opacity:.5; }

/* Modal */
.modal-mask { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.5); z-index:100; display:flex; align-items:flex-end; justify-content:center; animation:fadeIn .2s; }
.modal-sheet { width:100%; max-height:85vh; background:#fff; border-radius:16px 16px 0 0; padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px); overflow-y:auto; animation:slideUp .25s; }
.modal-center { align-items:center; padding:20px; }
.modal-dialog { width:100%; max-width:340px; background:#fff; border-radius:14px; padding:20px; animation:zoomIn .2s; }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
@keyframes slideUp { from { transform:translateY(100%); } to { transform:translateY(0); } }
@keyframes zoomIn { from { transform:scale(.85); opacity:0; } to { transform:scale(1); opacity:1; } }
.ms-hdr { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid #f0f0f0; }
.ms-title { font-size:15px; font-weight:600; }
.ms-close { font-size:22px; color:#999; cursor:pointer; padding:0 6px; line-height:1; }
.form-item { margin-bottom:12px; }
.form-label { display:block; font-size:12px; color:#666; margin-bottom:6px; }
.form-label .req { color:#e53935; }
.form-input, .form-select, .form-textarea { width:100%; padding:10px 12px; border:1px solid #e0e0e0; border-radius:8px; font-size:13.5px; background:#fafafa; outline:none; font-family:inherit; }
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color:#1976d2; background:#fff; }
.form-textarea { min-height:80px; resize:vertical; }
.form-hint { font-size:11px; color:#999; margin-top:4px; }
.photo-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.photo-add { aspect-ratio:1; background:#f5f5f5; border:1px dashed #ccc; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:22px; color:#999; cursor:pointer; }
.photo-item { aspect-ratio:1; background:linear-gradient(135deg,#90caf9,#42a5f5); border-radius:8px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:20px; position:relative; }
.photo-del { position:absolute; top:-4px; right:-4px; width:18px; height:18px; background:#ff5252; color:#fff; border-radius:50%; font-size:11px; display:flex; align-items:center; justify-content:center; cursor:pointer; }

/* Toast */
#toast { position:fixed; top:20%; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.8); color:#fff; padding:10px 18px; border-radius:8px; font-size:13px; z-index:999; opacity:0; transition:opacity .3s; pointer-events:none; max-width:80%; text-align:center; }
#toast.show { opacity:1; }

/* 数据同步 */
.sync-item { display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid #f2f2f2; }
.sync-item:last-child { border-bottom:none; }
.sync-ico { width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:18px; color:#fff; flex-shrink:0; }
.sync-body { flex:1; }
.sync-title { font-size:13.5px; font-weight:500; margin-bottom:2px; }
.sync-desc { font-size:11.5px; color:#888; }
.sync-btn { padding:6px 12px; border-radius:6px; background:#e3f2fd; color:#1976d2; border:none; font-size:12px; cursor:pointer; }
.sync-btn:active { background:#bbdefb; }

.me-hdr { background:linear-gradient(135deg,#1976d2,#42a5f5); border-radius:14px; padding:18px; color:#fff; margin-bottom:12px; display:flex; align-items:center; gap:14px; }
.me-av { width:56px; height:56px; border-radius:50%; background:rgba(255,255,255,.25); border:2px solid rgba(255,255,255,.5); display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:600; }
.me-name { font-size:16px; font-weight:600; margin-bottom:3px; }
.me-role { font-size:11.5px; opacity:.9; }
.me-tags { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
.me-tag { padding:2px 8px; background:rgba(255,255,255,.2); border-radius:8px; font-size:10.5px; }

.weather { display:flex; align-items:center; gap:12px; padding:12px; background:linear-gradient(135deg,#e1f5fe,#b3e5fc); border-radius:12px; margin-bottom:12px; }
.wt-ico { font-size:36px; }
.wt-temp { font-size:22px; font-weight:600; color:#01579b; }
.wt-desc { font-size:11.5px; color:#0277bd; margin-top:2px; }
.wt-right { margin-left:auto; text-align:right; font-size:11px; color:#0277bd; line-height:1.6; }

.map-mini { height:150px; background:linear-gradient(135deg,#e8f5e9 0%,#c8e6c9 50%,#a5d6a7 100%); border-radius:10px; position:relative; overflow:hidden; margin-bottom:10px; }
.map-mini::before { content:''; position:absolute; inset:0; background-image:linear-gradient(rgba(255,255,255,.3) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.3) 1px,transparent 1px); background-size:24px 24px; }
.map-dot { position:absolute; width:10px; height:10px; border-radius:50%; background:#1976d2; border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.3); }
.map-dot.red { background:#e53935; }
.map-dot.orange { background:#fb8c00; }
.map-dot.green { background:#43a047; }
.map-label { position:absolute; bottom:6px; left:8px; font-size:10px; color:#fff; background:rgba(0,0,0,.35); padding:2px 6px; border-radius:4px; }

/* ============ 微信风格对话窗（移动端全屏） ============ */
.mchat-overlay { position: fixed; inset: 0; background: #ededed; z-index: 2500; display: none; flex-direction: column; }
.mchat-overlay.active { display: flex; }
.mchat-hdr { background: #f7f7f7; padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 10px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #dcdcdc; flex-shrink: 0; }
.mchat-hdr .back { font-size: 20px; color: #333; padding: 4px 8px; cursor: pointer; }
.mchat-hdr .av { width: 34px; height: 34px; border-radius: 4px; background: linear-gradient(135deg,#42a5f5,#1976d2); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; }
.mchat-hdr .info { flex: 1; min-width: 0; }
.mchat-hdr .name { font-size: 14px; font-weight: 600; color: #222; }
.mchat-hdr .sub { font-size: 11px; color: #888; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mchat-hdr .acts { display: flex; gap: 4px; }
.mchat-hdr .acts button { width: 30px; height: 30px; border: none; background: transparent; font-size: 16px; cursor: pointer; color: #555; border-radius: 4px; }
.mchat-hdr .acts button:active { background: #e0e0e0; }
.mchat-body { flex: 1; overflow-y: auto; padding: 12px; -webkit-overflow-scrolling: touch; }
.mchat-time { text-align: center; margin: 8px 0; }
.mchat-time span { background: #cecece; color: #fff; font-size: 10.5px; padding: 2px 6px; border-radius: 3px; }
.mchat-msg { display: flex; gap: 6px; margin: 8px 0; align-items: flex-start; }
.mchat-msg.self { flex-direction: row-reverse; }
.mchat-msg .mav { width: 32px; height: 32px; border-radius: 4px; background: linear-gradient(135deg,#42a5f5,#1976d2); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; flex-shrink:0; }
.mchat-msg.self .mav { background: linear-gradient(135deg,#66bb6a,#388e3c); }
.mchat-msg .mc { max-width: 72%; }
.mchat-msg .mn { font-size: 10.5px; color: #999; margin-bottom: 2px; }
.mchat-msg.self .mn { text-align: right; }
.mbub { padding: 8px 11px; border-radius: 4px; background: #fff; font-size: 14px; color: #222; line-height: 1.5; word-break: break-word; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,.04); white-space: pre-wrap; }
.mbub::before { content:''; position:absolute; top:11px; left:-4px; width:0; height:0; border-top:4px solid transparent; border-bottom:4px solid transparent; border-right:4px solid #fff; }
.mchat-msg.self .mbub { background: #95ec69; }
.mchat-msg.self .mbub::before { left:auto; right:-4px; border-right:none; border-left:4px solid #95ec69; }
.mbub.voice { display:flex; align-items:center; gap:6px; min-width:70px; cursor:pointer; }
.mbub.voice .vi { font-size: 15px; }
.mbub.voice .vd { font-size: 11px; color: #666; }
.mchat-msg.self .mbub.voice .vd { color: #33691e; }
.mbub.image { padding: 3px; background: #fff; }
.mbub.image img { max-width: 180px; max-height: 180px; display: block; border-radius: 3px; }
.mbub.file { display: flex; align-items: center; gap: 8px; min-width: 180px; padding: 9px 10px; }

const SYNC_KEY = 'sanitation_ai_sync_v1';

function loadSync() {
  try {
    const raw = localStorage.getItem(SYNC_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { console.warn('localStorage 不可用，使用内置数据', e); }
  return null;
}
function saveSync() {
  try {
    const payload = {
      version: 1,
      savedAt: new Date().toISOString(),
      savedBy: (state.currentUser && state.currentUser.name) || 'mobile',
      employees, vehicles, workZones, personnelWorkAreas, snowZones,
      tasks, alerts, checkins, reports, attendance
    };
    localStorage.setItem(SYNC_KEY, JSON.stringify(payload));
    return true;
  } catch (e) { return false; }
}
function mergeSync(data) {
  if (!data) return;
  ['employees','vehicles','workZones','personnelWorkAreas','snowZones','tasks','alerts','checkins','reports','attendance'].forEach(k => {
    if (Array.isArray(data[k]) && data[k].length) {
      const target = eval(k);
      target.length = 0;
      data[k].forEach(x => target.push(x));
    }
  });
}

function roleOf(position, department) {
  const p = String(position || '');
  if (p === '总经理') return 'executive';
  if (p === '项目经理') return 'pm';
  if (p.indexOf('部经理') >= 0 || p === '运营经理') return 'manager';
  if (p.indexOf('片区经理') >= 0 || p.indexOf('班组长') >= 0 || p === '车队长' || p.indexOf('队长') >= 0) return 'teamleader';
  if (p === '司机' || p === '驾驶员') return 'driver';
  if (p === '保洁员' || p === '辅助工' || p.indexOf('保洁') >= 0) return 'worker';
  if (p === '财务' || p.indexOf('综合管理') >= 0 || p.indexOf('行政') >= 0 || p.indexOf('文员') >= 0 || department === '财务部' || department === '综合管理部') return 'office';
  if (department === '管理层') return 'executive';
  if (p === '系统管理员' || department === '信息中心') return 'admin';

}

function $(id) { return document.getElementById(id); }
function pad(n) { return String(n).padStart(2, '0'); }

function timeStr() { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
function dateStr() { const d = new Date(); const w = ['周日','周一','周二','周三','周四','周五','周六']; return d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日 ' + w[d.getDay()]; }
function getEmp(id) { return employees.find(e => e.id === id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }
function showToast(msg) {
  const t = $('toast');

  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove('show'), 2000);
}
function openSheet(title, bodyHtml, buttons) {

    + '<div class="ms-hdr"><div class="ms-title">' + esc(title) + '</div><div class="ms-close" onclick="closeModal()">×</div></div>'

function bindLoginEvents() {
  const acc = $('lg-account'), pwd = $('lg-pwd'), btn = $('lg-submit');
  if (btn) btn.onclick = doLogin;
  if (pwd) pwd.onkeydown = (ev) => { if (ev.key === 'Enter') doLogin(); };
  if (acc) acc.onkeydown = (ev) => { if (ev.key === 'Enter' && pwd) pwd.focus(); };
  if (acc && !acc.value) setTimeout(() => acc.focus(), 100);
  else if (pwd) setTimeout(() => pwd.focus(), 100);
}
function doLogin() {
  const accEl = $('lg-account'), pwdEl = $('lg-pwd'), remEl = $('lg-remember');
  const acc = (accEl && accEl.value || '').trim();
  const pwd = (pwdEl && pwdEl.value) || '';
  const remember = remEl && remEl.checked;
  if (!acc) { showToast('请输入账号'); if (accEl) accEl.focus(); return; }
  if (!pwd) { showToast('请输入密码'); if (pwdEl) pwdEl.focus(); return; }
  const u = employees.find(e => String(e.account || '').toLowerCase() === acc.toLowerCase());
  if (!u) { showToast('账号不存在，请联系管理员开通'); return; }
  if (u.accountStatus === 'disabled') { showToast('账号已停用，请联系管理员'); return; }
  if (u.accountStatus === 'locked') { showToast('账号已锁定，请联系管理员解锁'); return; }
  if (u.password !== pwd) {
    u.loginFailCount = (u.loginFailCount || 0) + 1;
    if (u.loginFailCount >= 5) {
      u.accountStatus = 'locked';
      saveSync();
      openDialog('账号已锁定', '密码连续输错 5 次，账号 <b>' + esc(u.account) + '</b> 已被锁定。<br><br>请联系系统管理员（13901001099）解锁后重试。', [{ text:'知道了', class:'btn-primary', action:'closeModal()' }]);
      return;
    }
    saveSync();
    showToast('密码错误，还剩 ' + (5 - u.loginFailCount) + ' 次机会');
    if (pwdEl) { pwdEl.value = ''; pwdEl.focus(); }
    return;
  }
  u.loginFailCount = 0;
  u.lastLogin = new Date().toISOString();
  try {
    if (remember) localStorage.setItem('sanitation_mobile_remember_account', u.account);
    else localStorage.removeItem('sanitation_mobile_remember_account');
  } catch(e) {}
  if (u.mustChangePwd) {
    state.pendingUser = u;
    saveSync();
    openChangePwdModal(true);
    return;
  }
  saveSync();
  finishLogin(u);
}
function finishLogin(u) {

    + '<div class="form-item"><label class="form-label">确认新密码</label><input type="password" class="form-input" id="cp-new2" placeholder="再次输入新密码"></div>'
    + '<div class="form-hint" style="margin-top:8px;color:#999;font-size:11.5px">密码规则：至少 6 位，建议包含大小写字母、数字或符号；请勿使用生日、手机号等易猜信息。</div>',
    isFirst
      ? [{ text:'设置并登录', class:'btn-primary', action:'submitChangePwd(true)' }]
      : [{ text:'取消', class:'btn-default', action:'closeModal()' }, { text:'保存', class:'btn-primary', action:'submitChangePwd(false)' }]);
}
function submitChangePwd(isFirst) {
  const u = state.pendingUser || state.currentUser;
  if (!u) { closeModal(); return; }
  const oldPwd = $('cp-old') ? ($('cp-old').value || '') : u.password;
  const p1 = $('cp-new1').value || '';
  const p2 = $('cp-new2').value || '';
  if (!isFirst && oldPwd !== u.password) { showToast('当前密码错误'); return; }
  if (p1.length < 6) { showToast('新密码至少6位'); return; }
  if (p1 !== p2) { showToast('两次输入的新密码不一致'); return; }
  if (p1 === u.password) { showToast('新密码不能与原密码相同'); return; }
  u.password = p1;
  u.mustChangePwd = false;
  state.pendingUser = null;
  saveSync();
  closeModal();
  if (isFirst) {
    finishLogin(u);
    showToast('密码已修改，欢迎使用');
  } else {
    showToast('密码修改成功');
    if (state.tab === 'me') $('content').innerHTML = renderTabContent();
  }
}

function renderMapDots(emps, vehs) {
  const pts = [];
  emps.slice(0,6).forEach((e,i) => pts.push({ x: 12 + (i*13)%76, y: 18 + (i*17)%58, cls: e.status==='在岗' ? 'green' : 'orange' }));
  vehs.slice(0,4).forEach((v,i) => pts.push({ x: 20 + (i*19)%70, y: 30 + (i*23)%50, cls: v.status==='作业中' ? '' : 'red' }));
  return pts.map(p => '<div class="map-dot ' + p.cls + '" style="left:' + p.x + '%;top:' + p.y + '%"></div>').join('');
}
function quickItem(ico, lbl, cls, action) {

function renderWork() {
  const u = state.currentUser;
  const isMgmt = !isWorker();
  let list = tasks.slice();
  if (isWorker()) list = list.filter(t => t.assigneeId === u.id);
  else if (state.currentRole === 'teamleader' && u.zoneName && u.zoneName !== '全片区机动') list = list.filter(t => t.zoneName === u.zoneName || t.zoneName === '全片区');
  if (state.taskFilter === 'pending') list = list.filter(t => t.status !== '已完成');
  else if (state.taskFilter === 'running') list = list.filter(t => t.status === '进行中');
  else if (state.taskFilter === 'done') list = list.filter(t => t.status === '已完成');
  return '<div class="segment">'
    +   segItem('pending','待办', state.taskFilter)
    +   segItem('running','进行中', state.taskFilter)
    +   segItem('done','已完成', state.taskFilter)
    +   segItem('all','全部', state.taskFilter)
    + '</div>'
    + (isMgmt ? '<div class="card"><div class="btn-row"><button class="btn btn-primary btn-block" onclick="openAssignTask()">＋ 下发新任务</button></div></div>' : '')
    + '<div class="card">'
    +   '<div class="card-hdr"><div class="card-title">任务列表（' + list.length + '）</div>' + (isWorker() ? '<div class="card-more" onclick="openReportModal(null)">上报 ›</div>' : '') + '</div>'
    +   (list.length ? list.map(t => {
        const e = getEmp(t.assigneeId);
        return '<div class="list-item" onclick="openTaskDetail(' + t.id + ')">'
          + '<div class="li-ico" style="background:' + (t.status==='已完成'?'#43a047':t.status==='进行中'?'#1976d2':'#fb8c00') + '">' + (t.status==='已完成'?'✓':t.status==='进行中'?'▶':'⏸') + '</div>'
          + '<div class="li-body"><div class="li-title">' + esc(t.title) + '</div>'
          +   '<div class="li-desc">' + esc(t.zoneName) + ' · ' + esc(e ? e.name : '未指派') + ' · ' + t.startTime + '-' + t.endTime + '</div>'
          +   '<div class="progress-row" style="margin-top:6px"><div class="pr-bar"><div class="pr-fill' + (t.progress>=80?' green':t.progress>=40?' orange':'') + '" style="width:' + t.progress + '%"></div></div><div class="pr-val">' + t.progress + '%</div></div>'
          + '</div>'

function renderAlerts() {
  let list = alerts.slice();
  if (isWorker()) list = list.filter(a => a.zoneName === state.currentUser.zoneName || a.zoneName === '全片区');
  else if (state.currentRole === 'teamleader' && state.currentUser.zoneName && state.currentUser.zoneName !== '全片区机动') list = list.filter(a => a.zoneName === state.currentUser.zoneName || a.zoneName === '全片区');
  if (state.alertFilter === 'unhandled') list = list.filter(a => a.status === '未处理');
  else if (state.alertFilter === 'high') list = list.filter(a => a.level === '高');
  else if (state.alertFilter === 'handled') list = list.filter(a => a.status === '已处理');
  const cnt = { all: alerts.length, unhandled: alerts.filter(a=>a.status==='未处理').length, high: alerts.filter(a=>a.level==='高').length, handled: alerts.filter(a=>a.status==='已处理').length };
  return '<div class="segment">'
    + '<div class="seg-item' + (state.alertFilter==='all'?' active':'') + '" onclick="setAlertFilter(\'all\')">全部 ' + cnt.all + '</div>'
    + '<div class="seg-item' + (state.alertFilter==='unhandled'?' active':'') + '" onclick="setAlertFilter(\'unhandled\')">未处理 ' + cnt.unhandled + '</div>'
    + '<div class="seg-item' + (state.alertFilter==='high'?' active':'') + '" onclick="setAlertFilter(\'high\')">高级 ' + cnt.high + '</div>'
    + '<div class="seg-item' + (state.alertFilter==='handled'?' active':'') + '" onclick="setAlertFilter(\'handled\')">已处理 ' + cnt.handled + '</div>'

    + '<div class="card">'
    +   (list.length ? list.map(a => '<div class="list-item" onclick="openAlertDetail(' + a.id + ')">'
        + '<div class="li-ico" style="background:' + (a.level==='高'?'#e53935':a.level==='中'?'#fb8c00':'#fdd835') + ';color:' + (a.level==='低'?'#333':'#fff') + '">' + (a.level==='高'?'🚨':a.level==='中'?'⚠️':'ℹ️') + '</div>'

function doCheckin() {
  const u = state.currentUser;
  const exist = checkins.find(c => c.employeeId === u.id && c.type === '上班' && c.time.startsWith('2026-11-06'));

  checkins.unshift({ id: Date.now(), employeeId: u.id, type:'上班', time: '2026-11-06 ' + timeStr().slice(0,5), location: loc, lat: 39.908 + Math.random()*0.01, lng: 116.412 + Math.random()*0.01, status:'正常' });

}

let photoCount = 0;
function addPhoto() {
  if (photoCount >= 6) { showToast('最多 6 张'); return; }
  photoCount++;
  const grid = $('rp-photos');
  const addBtn = grid.querySelector('.photo-add');
  const item = document.createElement('div');
  item.className = 'photo-item';
  item.innerHTML = '📷<div class="photo-del" onclick="event.stopPropagation();this.parentNode.remove();photoCount--">×</div>';
  grid.insertBefore(item, addBtn);
}
function submitReport() {
  const type = $('rp-type').value;
  const title = $('rp-title').value.trim();
  if (!title) { showToast('请填写标题'); return; }
  const desc = $('rp-desc').value.trim();
  const priority = $('rp-priority').value;
  const taskIdEl = $('rp-task');
  reports.unshift({ id: Date.now(), employeeId: state.currentUser.id, type, time: now(), title, desc, photos: photoCount, status:'待审核' });
  if (taskIdEl) {
    const t = tasks.find(x => x.id === parseInt(taskIdEl.value, 10));
    if (t) { t.status = '已完成'; t.progress = 100; }
  }
  if (priority === '紧急' || type === '异常事件') {
    alerts.unshift({ id: Date.now(), level: priority==='紧急'?'高':'中', type, title, source:'移动端上报', time: timeStr().slice(0,5), zoneName: state.currentUser.zoneName || '全片区', status:'未处理', desc: desc || title });
  }
  photoCount = 0;
  saveSync();
  closeModal();
  $('content').innerHTML = renderTabContent();
  showToast('上报成功，已同步至平台');
}

function exportJSON() {
  const payload = { version:1, savedAt:new Date().toISOString(), savedBy:'mobile-'+(state.currentUser?state.currentUser.name:'guest'), employees, vehicles, workZones, personnelWorkAreas, snowZones, tasks, alerts, checkins, reports, attendance };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'sanitation-sync-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast('已导出 JSON');
}
function importJSON() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { try { const d = JSON.parse(rd.result); mergeSync(d); try { localStorage.setItem(SYNC_KEY, JSON.stringify(d)); } catch(e){} $('content').innerHTML = renderTabContent(); showToast('导入成功'); } catch(e) { showToast('文件格式错误'); } };
    rd.readAsText(f, 'utf-8');
  };
  inp.click();
}
function pullFromWeb() {
  const d = loadSync();
  if (!d) { showToast('未检测到网页版数据'); return; }
  mergeSync(d);
  $('content').innerHTML = renderTabContent();
  showToast('已从本地拉取（' + d.savedAt.slice(11,19) + '）');
}

function mloadAllChats() {
  try { const raw = localStorage.getItem(MCHAT_KEY); return raw ? JSON.parse(raw) : {}; }
  catch(e) { return {}; }
}
function msaveAllChats(all) {
  try { localStorage.setItem(MCHAT_KEY, JSON.stringify(all)); } catch(e) {}
}
function mchatKeyFor(nameA, nameB) {
  const arr = [String(nameA||''), String(nameB||'')].sort();
  return 'chat_' + arr[0] + '__' + arr[1];
}
function mgetChatMessages(otherName) {
  if (!state.currentUser) return [];
  const key = mchatKeyFor(state.currentUser.name, otherName);
  const all = mloadAllChats();
  return all[key] || [];
}
function mappendChatMessage(otherName, msg) {
  if (!state.currentUser) return;
  const key = mchatKeyFor(state.currentUser.name, otherName);
  const all = mloadAllChats();
  if (!all[key]) all[key] = [];
  all[key].push(msg);
  msaveAllChats(all);
}
function mupdateChatMessage(otherName, msgId, patch) {
  if (!state.currentUser) return;
  const key = mchatKeyFor(state.currentUser.name, otherName);
  const all = mloadAllChats();
  const arr = all[key] || [];
  for (let i = 0; i < arr.length; i++) {
    if (arr[i].id === msgId) { Object.assign(arr[i], patch); break; }
  }
  all[key] = arr;
  msaveAllChats(all);
}

  $('mchatTools').innerHTML = toolsHtml;

  const emojiHtml = MEMOJI_LIST.map(x => '<span onclick="insertMobileEmoji(event)">' + x + '</span>').join('');
  $('memojiPanel').innerHTML = emojiHtml;
  $('memojiPanel').classList.remove('active');

  const ov = $('mchatOverlay');
  ov.classList.add('active');
  document.body.style.overflow = 'hidden';

  const ta = $('mchatInput');
  ta.value = '';
  ta.onkeydown = function(ev) {
    if (ev.key === 'Enter' && !ev.shiftKey && !/Mobi|Android/i.test(navigator.userAgent)) {
      ev.preventDefault();
      sendMobileChat();
    }
  };

  renderMobileChatBody();
  setTimeout(() => { try { ta.focus(); } catch(_){} }, 60);
}

function closeMobileChat() {
  if (__mchatState.recording) {
    try { stopMobileVoiceRecord(true); } catch(_){}
  }
  if (__mchatState.autoReplyTimer) { clearTimeout(__mchatState.autoReplyTimer); __mchatState.autoReplyTimer = null; }
  const ov = $('mchatOverlay');
  if (ov) ov.classList.remove('active');
  document.body.style.overflow = '';
  __mchatState.otherId = null;
}

function renderMobileChatBody() {
  const e = getEmp(__mchatState.otherId);
  const body = $('mchatBody');
  if (!e) { body.innerHTML = '<div class="mchat-empty">请选择联系人</div>'; return; }
  const msgs = mgetChatMessages(e.name);
  if (!msgs.length) {
    body.innerHTML =
      '<div class="mchat-time"><span>' + mfmtDate(Date.now()) + '</span></div>' +
      '<div class="mchat-msg"><div class="mc" style="max-width:100%"><div class="mbub system">已向 ' + esc(e.name) + ' 发起对话，可发送文字/语音/图片/文件</div></div></div>';
    return;
  }
  let html = '';
  let lastTime = 0;
  msgs.forEach(m => {
    if (m.time - lastTime > 5 * 60 * 1000) {
      html += '<div class="mchat-time"><span>' + mfmtDate(m.time) + '</span></div>';
      lastTime = m.time;
    }
    html += renderMobileBubble(m, e);
  });
  body.innerHTML = html;
  body.scrollTop = body.scrollHeight;
}

function renderMobileBubble(m, other) {
  const isSelf = m.from === 'self';
  const who = isSelf ? state.currentUser : other;
  const avatarChar = ((who && who.name) || '?').slice(-2);
  const avCls = isSelf ? 'mav self' : 'mav';
  const rowCls = isSelf ? 'mchat-msg self' : 'mchat-msg';
  const statHtml = isSelf && m.status ? ('<span class="mstat">' + (m.status==='read'?'已读':(m.status==='sent'?'已发送':'发送中')) + '</span>') : '';
  let bub = '';
  if (m.type === 'text') {
    bub = '<div class="mbub text">' + esc(m.content||'').replace(/\n/g,'<br>') + '</div>';
  } else if (m.type === 'emoji') {
    bub = '<div class="mbub emoji">' + esc(m.content||'') + '</div>';
  } else if (m.type === 'system') {
    return '<div class="mchat-msg"><div class="mc"><div class="mbub system">' + esc(m.content||'') + '</div></div></div>';
  } else if (m.type === 'voice') {
    const dur = (m.meta && m.meta.duration) ? m.meta.duration : 0;
    const w = Math.max(70, Math.min(180, 70 + dur*8));
    bub = '<div class="mbub voice" style="min-width:' + w + 'px" onclick="playMobileVoice(\'' + m.id + '\')">' +
      '<span class="vi">🎤</span><span class="vd">' + dur + '″</span>' +
      (m.content ? ('<audio id="aud_' + m.id + '" src="' + m.content + '" style="display:none"></audio>') : '') +
      '</div>';
  } else if (m.type === 'image') {
    bub = '<div class="mbub image" onclick="previewMobileImage(\'' + m.id + '\')"><img src="' + m.content + '" alt="image"></div>';
  } else if (m.type === 'file') {
    const nm = (m.meta && m.meta.name) || 'file';
    const sz = (m.meta && m.meta.size) || 0;
    const ext = (nm.split('.').pop()||'').toLowerCase();
    const ico = /xls|csv/.test(ext)?'📊':(/doc/.test(ext)?'📄':(/pdf/.test(ext)?'📕':(/ppt/.test(ext)?'📽':(/zip|rar|7z/.test(ext)?'🗜':(/mp3|wav|m4a/.test(ext)?'🎵':(/mp4|mov|avi/.test(ext)?'🎬':'📎'))))));
    const kb = sz > 1024*1024 ? (sz/1024/1024).toFixed(1)+'MB' : Math.max(1, Math.round(sz/1024))+'KB';
    bub = '<div class="mbub file" onclick="downloadMobileFile(\'' + m.id + '\')">' +
      '<div class="fi">' + ico + '</div>' +
      '<div style="min-width:0;flex:1"><div class="fn">' + esc(nm) + '</div><div class="fs">' + kb + '</div></div>' +
      '</div>';
  } else {
    bub = '<div class="mbub text">' + esc(m.content||'') + '</div>';
  }
  return '<div class="' + rowCls + '">' +
    '<div class="' + avCls + '">' + esc(avatarChar) + '</div>' +
    '<div class="mc"><div class="mn">' + esc((who && who.name) || '') + '</div>' + bub + statHtml + '</div>' +
    '</div>';
}

function sendMobileChat() {
  const ta = $('mchatInput');
  const txt = (ta.value || '').trim();
  if (!txt) return;
  const other = getEmp(__mchatState.otherId);
  if (!other) return;
  const isEmojiOnly = /^(\p{Extended_Pictographic}|\uFE0F|\u200D|\s)+$/u.test(txt) && txt.length <= 16;
  const type = isEmojiOnly ? 'emoji' : 'text';
  const msg = { id: muid(), from: 'self', type: type, content: txt, time: Date.now(), status: 'sent' };
  mappendChatMessage(other.name, msg);
  ta.value = '';
  $('memojiPanel').classList.remove('active');
  renderMobileChatBody();
  scheduleMobileAutoReply(txt, other);
}

function sendMobileQuickSystem(text) {
  const other = getEmp(__mchatState.otherId);
  if (!other) return;
  const msg = { id: muid(), from: 'self', type: 'system', content: text, time: Date.now(), status: 'sent' };
  mappendChatMessage(other.name, msg);
  renderMobileChatBody();
  showToast('已发送');
}

function scheduleMobileAutoReply(userText, other) {
  const REPLIES = [
    '收到，我马上处理。',
    '好的，稍后回复你。',
    '明白，谢谢提醒！',
    '我这边已经在跟进了。',
    '了解，需要我做什么请告诉我。',
    '今天班次我记下了。',
    '已上传相关资料，请查阅。'
  ];
  if (__mchatState.autoReplyTimer) clearTimeout(__mchatState.autoReplyTimer);
  const delay = 1200 + Math.random() * 1200;
  __mchatState.autoReplyTimer = setTimeout(() => {
    const r = REPLIES[Math.floor(Math.random()*REPLIES.length)];
    const msg = { id: muid(), from: 'other', type: 'text', content: r, time: Date.now() };
    mappendChatMessage(other.name, msg);
    // 标记我方消息为已读
    const key = mchatKeyFor(state.currentUser.name, other.name);
    const all = mloadAllChats();
    (all[key]||[]).forEach(x => { if (x.from === 'self' && x.status !== 'read') x.status = 'read'; });
    msaveAllChats(all);
    if (__mchatState.otherId === other.id) renderMobileChatBody();
    __mchatState.autoReplyTimer = null;
  }, delay);
}

// ===== 语音 =====
function toggleMobileVoiceRecord() {
  if (__mchatState.recording) stopMobileVoiceRecord(false);
  else startMobileVoiceRecord();
}
function startMobileVoiceRecord() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
    showToast('当前浏览器不支持录音');
    return;
  }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    try {
      const mr = new MediaRecorder(stream);
      __mchatState.mediaRecorder = mr;
      __mchatState.audioChunks = [];
      __mchatState.recordStart = Date.now();
      mr.ondataavailable = ev => { if (ev.data && ev.data.size) __mchatState.audioChunks.push(ev.data); };
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        const blob = new Blob(__mchatState.audioChunks, { type: mr.mimeType || 'audio/webm' });
        const dur = Math.max(1, Math.round((Date.now() - __mchatState.recordStart)/1000));
        const rd = new FileReader();
        rd.onload = () => {
          const other = getEmp(__mchatState.otherId);
          if (!other) return;
          const msg = { id: muid(), from: 'self', type: 'voice', content: rd.result, meta: { duration: dur, mime: blob.type }, time: Date.now(), status: 'sent' };
          mappendChatMessage(other.name, msg);
          renderMobileChatBody();
          scheduleMobileAutoReply('[语音]', other);
        };
        rd.readAsDataURL(blob);
      };
      mr.start();
      __mchatState.recording = true;
      const btn = $('mtVoice');
      if (btn) { btn.classList.add('rec'); btn.textContent = '⏹'; }
      showToast('开始录音，再次点击结束');
      __mchatState.recordTickTimer = setInterval(() => {
        const s = Math.round((Date.now() - __mchatState.recordStart)/1000);
        const b = $('mtVoice');
        if (b) b.title = '录音中 ' + s + '″';
      }, 500);
    } catch(err) { showToast('录音启动失败'); }
  }).catch(err => {
    showToast('无法访问麦克风（file:// 协议或权限受限）');
  });
}
function stopMobileVoiceRecord(silent) {
  if (!__mchatState.recording) return;
  try { __mchatState.mediaRecorder && __mchatState.mediaRecorder.stop(); } catch(_){}
  __mchatState.recording = false;
  if (__mchatState.recordTickTimer) { clearInterval(__mchatState.recordTickTimer); __mchatState.recordTickTimer = null; }
  const btn = $('mtVoice');
  if (btn) { btn.classList.remove('rec'); btn.textContent = '🎤'; btn.title = '语音'; }
  if (!silent) showToast('录音结束');
}
function playMobileVoice(id) {
  const a = document.getElementById('aud_' + id);
  if (!a) { showToast('语音不可用'); return; }
  try { a.currentTime = 0; a.play(); } catch(e) { showToast('播放失败'); }
}

// ===== 文件/图片/拍照 =====
function handleMobileChatFile(ev) {
  const inp = ev.target;
  const file = inp.files && inp.files[0];
  if (!file) return;
  const other = getEmp(__mchatState.otherId);
  if (!other) { inp.value = ''; return; }
  if (file.size > 8 * 1024 * 1024) {
    showToast('文件过大（限制8MB）');
    inp.value = '';
    return;
  }
  const isImage = /^image\//.test(file.type);
  const rd = new FileReader();
  rd.onload = () => {
    const type = isImage ? 'image' : 'file';
    const msg = {
      id: muid(), from: 'self', type: type, content: rd.result,
      meta: { name: file.name, size: file.size, mime: file.type },
      time: Date.now(), status: 'sent'
    };
    mappendChatMessage(other.name, msg);
    renderMobileChatBody();
    scheduleMobileAutoReply(isImage ? '[图片]' : '[文件]', other);
    showToast(isImage ? '图片已发送' : '文件已发送');
  };
  rd.onerror = () => showToast('读取失败');
  rd.readAsDataURL(file);
  inp.value = '';
}

function downloadMobileFile(id) {
  const other = getEmp(__mchatState.otherId);
  if (!other) return;
  const msgs = mgetChatMessages(other.name);
  const m = msgs.find(x => x.id === id);
  if (!m || m.type !== 'file') return;
  const a = document.createElement('a');
  a.href = m.content;
  a.download = (m.meta && m.meta.name) || 'file';
  document.body.appendChild(a); a.click(); a.remove();
}

function previewMobileImage(id) {
  const other = getEmp(__mchatState.otherId);
  if (!other) return;
  const msgs = mgetChatMessages(other.name);
  const m = msgs.find(x => x.id === id);
  if (!m || m.type !== 'image') return;
  const p = $('mimgPreview');
  $('mimgPreviewEl').src = m.content;
  p.classList.add('active');
}

// ===== 表情 =====
function toggleMobileEmoji() {
  const p = $('memojiPanel');
  if (!p) return;
  p.classList.toggle('active');
}
function insertMobileEmoji(ev) {
  const ch = (ev && ev.target && ev.target.textContent) || '';
  if (!ch) return;
  const ta = $('mchatInput');
  ta.value = (ta.value || '') + ch;
  try { ta.focus(); } catch(_){}
}

// ===== 清空历史 =====
function clearMobileChatHistory() {
  const other = getEmp(__mchatState.otherId);
  if (!other) return;
  openDialog('清空聊天记录', '将删除与 <b>' + esc(other.name) + '</b> 的所有本地消息（网页端同步清除）。此操作不可恢复。', [
    { text:'取消', class:'btn-default', action:'closeModal()' },
    { text:'确认清空', class:'btn-danger', action:'doClearMobileChat(' + other.id + ')' }
  ]);
}
function doClearMobileChat(id) {
  const other = getEmp(id);
  if (!other) { closeModal(); return; }
  const key = mchatKeyFor(state.currentUser.name, other.name);
  const all = mloadAllChats();
  delete all[key];
  msaveAllChats(all);
  closeModal();
  renderMobileChatBody();
  showToast('聊天记录已清空');
}

// ============ 启动 ============
function init() {
  const synced = loadSync();
  if (synced) mergeSync(synced);
  restoreState();
  render();
  window.addEventListener('storage', (e) => {
    if (e.key === SYNC_KEY && e.newValue) {
      try { const d = JSON.parse(e.newValue); mergeSync(d); if (state.currentUser) $('content').innerHTML = renderTabContent(); showToast('检测到网页版数据更新'); } catch(err){}
    }
  });
}
init();
</script>
