    '<span class="tag ' + (r.urgency.includes('紧急') ? 'tag-red' : r.urgency.includes('较急') ? 'tag-orange' : 'tag-blue') + '">' + r.urgency + '</span>' +
    '</div>' +
    '<div style="font-size:13px;color:var(--text-secondary)">领取人：' + r.applicant + '（' + r.position + ' · ' + r.department + '） · ' + r.date + '</div>' +
    '</div>';

  html += '<div class="desc-list" style="margin-bottom:16px">' +
    '<div class="desc-item"><div class="desc-label">领取类型</div><div class="desc-value">' + r.reqType + '</div></div>' +
    '<div class="desc-item"><div class="desc-label">领取事由</div><div class="desc-value">' + (r.reason || '-') + '</div></div>' +
    '<div class="desc-item"><div class="desc-label">审批人</div><div class="desc-value">' + r.approver + '</div></div>' +
    '</div>';

  html += '<div style="margin-bottom:16px"><h4 style="margin-bottom:8px">领取物品</h4>' +
    '<table style="font-size:12px"><thead><tr><th>物品</th><th>规格</th><th>数量</th><th>单位</th></tr></thead><tbody>' +
    r.items.map(i => '<tr><td>' + i.name + '</td><td>' + (i.spec || '-') + '</td><td>' + i.qty + '</td><td>' + i.unit + '</td></tr>').join('') +
    '</tbody></table></div>';

  if (r.workflowSteps.length > 0) {
    html += '<div><h4 style="margin-bottom:8px">执行流程</h4>';
    r.workflowSteps.forEach(s => {
      const statusColor = s.status === '已完成' ? 'var(--success)' : s.status === '进行中' ? 'var(--primary)' : 'var(--text-tertiary)';
      html += '<div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--border-light);border-radius:8px;margin-bottom:6px">' +
        '<div style="width:32px;height:32px;border-radius:50%;background:' + statusColor + ';color:white;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0">' +
        (s.status === '已完成' ? '&#10003;' : s.step) + '</div>' +
        '<div style="flex:1"><div style="font-weight:600">第' + s.step + '步：' + s.name + '</div>' +
        '<div style="font-size:12px;color:var(--text-secondary)">负责人：' + s.assignee + '</div></div>' +
        '<div style="text-align:right">' +
        '<div><span class="tag ' + (s.status === '已完成' ? 'tag-green' : s.status === '进行中' ? 'tag-blue' : 'tag-orange') + '">' + s.status + '</span></div>' +
        (s.time ? '<div style="font-size:11px;color:var(--text-tertiary);margin-top:2px">' + s.time + '</div>' : '') +
        '</div></div>';
    });
    html += '</div>';
  }

  openModal('物料领取详情 - ' + r.id, html, [
    { text: '关闭', class: 'btn-default', action: 'closeModal()' }
  ]);
}

function renderMatDistCard(d) {
  const statusMap = {
    '待审批': 'tag-orange', '已批准': 'tag-blue', '发放中': 'tag-blue', '已完成': 'tag-green', '已驳回': 'tag-red'
  };
  const progressPct = d.totalSteps > 0 ? Math.round((d.currentStep / d.totalSteps) * 100) : 0;

  // 流程步骤可视化
  let stepsHtml = '<div style="display:flex;align-items:flex-start;gap:0;margin:16px 0;position:relative">';
  d.workflowSteps.forEach((s, idx) => {
    const isLast = idx === d.workflowSteps.length - 1;
    const dotColor = s.status === '已完成' ? 'var(--success)' : s.status === '进行中' ? 'var(--primary)' : 'var(--border)';
    const lineColor = s.status === '已完成' ? 'var(--success)' : 'var(--border)';
    stepsHtml += '<div style="flex:1;text-align:center;position:relative">' +
      '<div style="width:28px;height:28px;border-radius:50%;background:' + dotColor + ';color:white;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-bottom:4px;position:relative;z-index:1">' +
      (s.status === '已完成' ? '&#10003;' : s.step) + '</div>' +
      '<div style="font-size:12px;font-weight:600;color:' + (s.status !== '待执行' ? 'var(--text-primary)' : 'var(--text-tertiary)') + '">' + s.name + '</div>' +
      '<div style="font-size:11px;color:var(--text-secondary)">' + s.assignee + '</div>' +
      (s.time ? '<div style="font-size:10px;color:var(--text-tertiary);margin-top:2px">' + s.time + '</div>' : '<div style="font-size:10px;color:var(--text-tertiary);margin-top:2px">' + s.status + '</div>') +
      '</div>';
    if (!isLast) {
      stepsHtml += '<div style="position:absolute;top:14px;left:calc(50% + 14px);right:calc(-50% + 14px);height:2px;background:' + lineColor + ';z-index:0"></div>';
    }
  });
  stepsHtml += '</div>';

  // 操作按钮
  let actionHtml = '';
  const currentStepObj = d.workflowSteps.find(s => s.status === '进行中');
  if (currentStepObj) {
    if (currentStepObj.step === 1) {
      actionHtml = '<button class="btn btn-primary btn-sm" onclick="executeMatDistStep(\'' + d.id + '\', 1)">&#128230; 仓库确认出库</button>';
    } else if (currentStepObj.step === 2) {
      actionHtml = '<button class="btn btn-primary btn-sm" onclick="executeMatDistStep(\'' + d.id + '\', 2)">&#10003; 发放人确认接收</button>';
    } else if (currentStepObj.step === 3) {
      const transferredCount = d.recipients.filter(r => r.status === '已移交' || r.status === '已接收').length;
      actionHtml = '<button class="btn btn-primary btn-sm" onclick="executeMatDistStep(\'' + d.id + '\', 3)">&#128666; 发放人移交（' + transferredCount + '/' + d.recipients.length + '）</button>';
    } else if (currentStepObj.step === 4) {
      const receivedCount = d.recipients.filter(r => r.status === '已接收').length;
      actionHtml = '<button class="btn btn-success btn-sm" onclick="showBatchReceiveModal(\'' + d.id + '\')">&#9989; 接收人签收（' + receivedCount + '/' + d.recipients.length + '）</button>';
    }
  }
  if (d.status === '待审批') {
    actionHtml = '<span style="font-size:13px;color:var(--text-secondary)">等待审批中...</span> ' +
      '<button class="btn btn-success btn-sm" onclick="approveDistribution(\'' + d.id + '\')">模拟审批通过</button>';
  }

  // 物资清单摘要
  const itemsSummary = d.items.map(i => i.name + '×' + i.qty + i.unit).join('、');

  return '<div class="card" style="margin-bottom:16px">' +
    '<div class="card-header" style="display:flex;justify-content:space-between;align-items:center">' +
    '<div>' +
    '<strong style="font-size:15px">' + d.id + '</strong>' +
    '<span class="tag ' + (statusMap[d.status] || 'tag-gray') + '" style="margin-left:8px">' + d.status + '</span>' +
    '</div>' +
    '<div style="font-size:13px;color:var(--text-secondary)">' + d.date + '</div>' +
    '</div>' +
    '<div class="card-body" style="padding:16px 24px">' +
    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;font-size:13px;margin-bottom:12px">' +
    '<div>申请人：<strong>' + d.applicant + '</strong></div>' +
    '<div>发放人：<strong>' + d.distributor + '</strong>（' + d.distributorRole + '）</div>' +
    '<div>覆盖范围：' + d.scopeDesc + '</div>' +
    (d.totalPeople ? '<div>覆盖人数：<strong style="color:var(--primary)">' + d.totalPeople + '</strong> 人' + (d.selectedUnitIds ? '（' + d.selectedUnitIds.length + '个单位）' : '') + '</div>' : '') +
    '</div>' +
    '<div style="background:var(--bg-page);border-radius:6px;padding:10px 14px;margin-bottom:12px;font-size:13px">' +
    '<span style="color:var(--text-secondary)">物资清单：</span>' + itemsSummary +
    '<span style="float:right;color:var(--danger);font-weight:600">' + d.totalCost + '元</span>' +
    '</div>' +
    stepsHtml +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--border-light)">' +
    '<div style="display:flex;align-items:center;gap:8px">' +
    '<div class="progress-bar" style="width:120px"><div class="progress-fill ' + (progressPct >= 100 ? 'green' : 'blue') + '" style="width:' + progressPct + '%"></div></div>' +
    '<span style="font-size:12px;color:var(--text-secondary)">' + d.currentStep + '/' + d.totalSteps + ' 步 (' + progressPct + '%)</span>' +
    '</div>' +
    '<div style="display:flex;gap:8px">' + actionHtml +
    '<button class="btn btn-default btn-sm" onclick="showMatDistDetail(\'' + d.id + '\')">详情</button>' +
    '</div>' +
    '</div>' +
    '</div>' +
    '</div>';
}

// 执行流程步骤
function executeMatDistStep(distId, stepNum) {
  const d = materialDistributions.find(x => x.id === distId);
  if (!d) return;

  const step = d.workflowSteps.find(s => s.step === stepNum);
  if (!step || step.status !== '进行中') return;

  const now = new Date();
  const timeStr = now.toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });

  if (stepNum === 1) {
    // 仓库出库
    if (confirm('确认仓库已出库？\n\n出库后发放人（' + d.distributor + '）将接收到物资。')) {
      step.status = '已完成';
      step.time = timeStr;
      step.note = '已出库，发放人待接收';
      d.currentStep = 2;
      const nextStep = d.workflowSteps.find(s => s.step === 2);
      if (nextStep) {
        nextStep.status = '进行中';
        nextStep.note = '待发放人确认接收';
      }
      d.status = '发放中';
      alert('【仓库出库】已完成！\n\n发放人 ' + d.distributor + ' 已收到待办通知：确认接收物资。');
      switchMatDistTab('active');
    }
  } else if (stepNum === 2) {
    // 发放人接收
    if (confirm('发放人 ' + step.assignee + ' 确认接收物资？\n\n接收后可开始向各接收人移交。')) {
      step.status = '已完成';
      step.time = timeStr;
      step.note = '已接收，待移交';
      d.currentStep = 3;
      const nextStep = d.workflowSteps.find(s => s.step === 3);
      if (nextStep) {
        nextStep.status = '进行中';
        nextStep.note = '待发放人选择接收人并移交';
      }
      alert('【发放人接收】已完成！\n\n' + d.distributor + ' 已收到待办通知：选择接收人并移交物资。');
      switchMatDistTab('active');
    }
  } else if (stepNum === 3) {
    // 发放人移交 - 打开移交选择弹窗
    showTransferModal(distId);
  }
}

// 发放人移交弹窗 - 选择接收人并移交
function showTransferModal(distId) {
  const d = materialDistributions.find(x => x.id === distId);
  if (!d) return;

  const step3 = d.workflowSteps.find(s => s.step === 3);
  const pendingRecipients = d.recipients.filter(r => r.status === '待接收');

  let html = '<div style="margin-bottom:16px">' +
    '<div style="background:var(--primary-bg);border-radius:8px;padding:12px 16px;margin-bottom:12px">' +
    '<div style="font-weight:600;color:var(--primary);margin-bottom:4px">&#128230; 发放人移交物资</div>' +
    '<div style="font-size:13px;color:var(--text-secondary)">发放人 <strong>' + d.distributor + '</strong> 选择要移交的接收人，确认移交后接收人将收到签收通知。</div>' +
    '</div></div>';

  html += '<div style="margin-bottom:12px"><h4 style="margin-bottom:8px">待移交接收人（' + pendingRecipients.length + '/' + d.recipients.length + '）</h4>';
  html += '<table style="font-size:12px"><thead><tr>' +
    '<th style="width:40px"><input type="checkbox" id="transferSelectAll" onchange="toggleTransferRecipients(\'' + distId + '\', this.checked)" style="width:16px;height:16px"></th>' +
    '<th>接收人</th><th>岗位</th><th>覆盖单位</th><th>覆盖人数</th><th>分配物资</th><th>状态</th>' +
    '</tr></thead><tbody>';

  d.recipients.forEach((r, idx) => {
    const isChecked = r.status === '待接收' ? 'checked' : '';
    const isDisabled = r.status !== '待接收' ? 'disabled' : '';
    const statusTag = r.status === '已接收' ? '<span class="tag tag-green">已签收</span>' :
                     r.status === '已移交' ? '<span class="tag tag-blue">已移交</span>' :
                     '<span class="tag tag-orange">待接收</span>';
    html += '<tr id="transfer-row-' + idx + '">' +
      '<td><input type="checkbox" class="transfer-checkbox" data-recipient-idx="' + idx + '" ' + isChecked + ' ' + isDisabled + ' style="width:16px;height:16px"></td>' +
      '<td><strong>' + r.name + '</strong></td>' +
      '<td>' + r.position + '</td>' +
      '<td>' + (r.units ? r.units.join('、') : '-') + '</td>' +
      '<td>' + (r.peopleCount || '-') + '人</td>' +
      '<td style="max-width:160px">' + (r.items || '待分配') + '</td>' +
      '<td>' + statusTag + '</td></tr>';
  });
  html += '</tbody></table></div>';

  openModal('发放人移交物资 - ' + d.id, html, [
    { text: '取消', class: 'btn-default', action: 'closeModal()' },
    { text: '确认移交', class: 'btn-primary', action: 'confirmTransfer(\'' + distId + '\')' }
  ]);
}

function toggleTransferRecipients(distId, checked) {
  const d = materialDistributions.find(x => x.id === distId);
  if (!d) return;
  d.recipients.forEach((r, idx) => {
    if (r.status === '待接收') {
      const cb = document.querySelector('.transfer-checkbox[data-recipient-idx="' + idx + '"]');
      if (cb) cb.checked = checked;
    }
  });
}

function confirmTransfer(distId) {
  const d = materialDistributions.find(x => x.id === distId);
  if (!d) return;

  const selectedIdxs = Array.from(document.querySelectorAll('.transfer-checkbox:checked')).map(cb => parseInt(cb.dataset.recipientIdx));
  if (selectedIdxs.length === 0) {
    alert('请至少选择一个接收人');
    return;
  }

  const now = new Date();
  const timeStr = now.toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });

  // 更新选中接收人的状态为"已移交"
  selectedIdxs.forEach(idx => {
    d.recipients[idx].status = '已移交';
    d.recipients[idx].transferTime = timeStr;
  });

  const step3 = d.workflowSteps.find(s => s.step === 3);
  step3.note = '已移交 ' + selectedIdxs.length + '/' + d.recipients.length + ' 人';

  // 检查是否所有接收人都已移交
  const allTransferred = d.recipients.every(r => r.status === '已移交' || r.status === '已接收');
  if (allTransferred) {
    step3.status = '已完成';
    step3.time = timeStr;
    d.currentStep = 4;
    const step4 = d.workflowSteps.find(s => s.step === 4);
    step4.status = '进行中';
    step4.note = '待所有接收人确认签收';
  }

  closeModal();
  alert('已移交 ' + selectedIdxs.length + ' 人！\n\n' +
    (allTransferred ? '所有接收人已移交，等待签收确认。' : '部分接收人已移交，可继续移交剩余人员。') +
    '\n\n接收人将收到待办通知：确认签收物资。');
  switchMatDistTab('active');
}

// 接收人签收
function confirmReceive(distId, recipientIdx) {
  const d = materialDistributions.find(x => x.id === distId);
  if (!d) return;

  const r = d.recipients[recipientIdx];
  if (r.status === '已接收') return;

  const now = new Date();
  const timeStr = now.toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });

  r.status = '已接收';
  r.receiveTime = timeStr;

  // 检查是否所有接收人都已签收
  const allReceived = d.recipients.every(rec => rec.status === '已接收');
  if (allReceived) {
    const step4 = d.workflowSteps.find(s => s.step === 4);
    step4.status = '已完成';
    step4.time = timeStr;
    step4.note = '所有接收人已签收';
    d.currentStep = 4;
    d.status = '已完成';
    alert('【接收人签收】全部完成！\n\n所有 ' + d.recipients.length + ' 位接收人已签收，物资发放流程结束。');
  } else {
    const receivedCount = d.recipients.filter(rec => rec.status === '已接收').length;
    alert(r.name + ' 已签收！\n\n还有 ' + (d.recipients.length - receivedCount) + ' 位接收人待签收。');
  }
  switchMatDistTab('active');
}

// 批量确认签收
function showBatchReceiveModal(distId) {
  const d = materialDistributions.find(x => x.id === distId);
  if (!d) return;

  const pendingRecipients = d.recipients.filter(r => r.status !== '已接收');
  let html = '<div style="margin-bottom:12px;font-size:13px;color:var(--text-secondary)">以下接收人待确认签收，可逐一确认或批量签收：</div>';

  html += '<table style="font-size:12px"><thead><tr><th>接收人</th><th>岗位</th><th>分配物资</th><th>状态</th><th>操作</th></tr></thead><tbody>';
  d.recipients.forEach((r, idx) => {
    const isReceived = r.status === '已接收';
    html += '<tr id="recv-row-' + idx + '">' +
      '<td><strong>' + r.name + '</strong></td>' +
      '<td>' + r.position + '</td>' +
      '<td style="max-width:160px">' + (r.items || '待分配') + '</td>' +
      '<td><span class="tag ' + (isReceived ? 'tag-green' : 'tag-orange') + '">' + r.status + '</span></td>' +
      '<td>' + (isReceived ? '<span style="color:var(--text-tertiary);font-size:11px">' + r.receiveTime + '</span>' :
        '<button class="btn btn-success btn-sm" onclick="confirmReceive(\'' + distId + '\', ' + idx + ');showBatchReceiveModal(\'' + distId + '\')">确认签收</button>') +
      '</td></tr>';
  });
  html += '</tbody></table>';

  const receivedCount = d.recipients.filter(r => r.status === '已接收').length;
  html += '<div style="margin-top:12px;padding:10px;background:var(--bg-page);border-radius:6px;font-size:13px">' +
    '<strong>签收进度：</strong>' + receivedCount + '/' + d.recipients.length + ' 人已签收' +
    '<div class="progress-bar" style="margin-top:6px"><div class="progress-fill ' + (receivedCount === d.recipients.length ? 'green' : 'blue') + '" style="width:' + Math.round(receivedCount/d.recipients.length*100) + '%"></div></div>' +
    '</div>';

  openModal('接收人签收 - ' + d.id, html, [
    { text: '关闭', class: 'btn-default', action: 'closeModal()' },
    { text: '全部签收', class: 'btn-primary', action: 'batchConfirmReceive(\'' + distId + '\')' }
  ]);
}

function batchConfirmReceive(distId) {
  const d = materialDistributions.find(x => x.id === distId);
  if (!d) return;

  const now = new Date();
  const timeStr = now.toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });

  // 批量签收所有待接收的接收人
  d.recipients.forEach(r => {
    if (r.status !== '已接收') {
      r.status = '已接收';
      r.receiveTime = timeStr;
    }
  });

  const step4 = d.workflowSteps.find(s => s.step === 4);
  if (step4) {
    step4.status = '已完成';
    step4.time = timeStr;
    step4.note = '所有接收人已签收';
  }
  d.currentStep = 4;
  d.status = '已完成';

  closeModal();
  alert('全部签收完成！\n\n所有 ' + d.recipients.length + ' 位接收人已签收，物资发放流程结束。');
  switchMatDistTab('completed');
}

// 审批通过物资发放
function approveDistribution(distId) {
  const d = materialDistributions.find(x => x.id === distId);
  if (!d) return;

  if (confirm('确认审批通过该物资发放申请？\n\n通过后将自动生成四步执行流程。')) {
    d.status = '已批准';
    d.workflowSteps = generateDistributionWorkflow(d);
    d.workflowSteps[0].status = '进行中';
    d.currentStep = 1;

    // 同步更新审批流程记录
    if (d.approvalId) {
      const wf = workflowRecords.find(w => w.id === d.approvalId);
      if (wf) { wf.status = '已批准'; wf.currentStep = wf.totalSteps; }
    }
    alert('已批准！四步执行流程已生成，第一步"仓库出库"已激活。');
    switchMatDistTab('active');
  }
}

// 物资发放详情弹窗
function showMatDistDetail(distId) {
  const d = materialDistributions.find(x => x.id === distId);
  if (!d) return;

  let html = '<div style="margin-bottom:16px">' +
    '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">' +
    '<span class="tag tag-blue">' + d.id + '</span>' +
    '<span class="tag ' + (d.status === '已完成' ? 'tag-green' : d.status === '待审批' ? 'tag-orange' : 'tag-blue') + '">' + d.status + '</span>' +
    '</div>' +
    '<div style="font-size:13px;color:var(--text-secondary)">申请人：' + d.applicant + ' · ' + d.department + ' · ' + d.date + '</div>' +
    '</div>';

  // 物资清单
  html += '<div style="margin-bottom:16px"><h4 style="margin-bottom:8px">物资清单</h4>';
  if (d.perPersonItems && d.perPersonItems.length > 0) {
    html += '<div style="background:var(--primary-bg);border-radius:6px;padding:10px 14px;margin-bottom:10px">' +
      '<div style="font-weight:600;font-size:13px;margin-bottom:6px;color:var(--primary)">&#128100; 每人发放标准</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:6px">' +
      d.perPersonItems.map(i => '<span style="display:inline-block;background:white;border-radius:4px;padding:3px 10px;font-size:12px;border:1px solid var(--border-light)">' +
        i.name + (i.spec ? '(' + i.spec + ')' : '') + ' ' + i.qty + i.unit + '/人</span>').join('') +
      '</div></div>';
  }
  if (d.totalPeople) {
    html += '<div style="font-size:13px;margin-bottom:8px">覆盖人数：<strong>' + d.totalPeople + '</strong> 人</div>';
  }
  html += '<table style="font-size:12px"><thead><tr><th>物品</th><th>规格</th><th>数量</th><th>单位</th></tr></thead><tbody>' +
    d.items.map(i => '<tr><td>' + i.name + '</td><td>' + (i.spec || '-') + '</td><td>' + i.qty + '</td><td>' + i.unit + '</td></tr>').join('') +
    '</tbody></table>' +
    '<div style="margin-top:6px;font-size:13px;text-align:right">预估总费用：<strong style="color:var(--danger)">' + d.totalCost + '元</strong></div></div>';

  // 发放信息
  html += '<div class="desc-list" style="margin-bottom:16px">' +
    '<div class="desc-item"><div class="desc-label">覆盖范围</div><div class="desc-value">' + d.scopeDesc + '</div></div>' +
    '<div class="desc-item"><div class="desc-label">发放人</div><div class="desc-value">' + d.distributor + '（' + d.distributorRole + '）</div></div>';
  if (d.selectedUnitIds && d.selectedUnitIds.length > 0) {
    const unitNames = d.selectedUnitIds.map(uid => { const u = workUnits.find(w => w.id === uid); return u ? u.name : uid; });
    html += '<div class="desc-item"><div class="desc-label">作业单位</div><div class="desc-value">' + unitNames.join('、') + '（' + unitNames.length + '个）</div></div>';
  }
  if (d.recipients && d.recipients.length > 0) {
    html += '<div class="desc-item"><div class="desc-label">接收人</div><div class="desc-value">' + d.recipients.map(r => r.name + '(' + r.position + ')').join('、') + '</div></div>';
  }
  html += '</div>';

  // 接收人列表
  html += '<div style="margin-bottom:16px"><h4 style="margin-bottom:8px">接收人签收情况</h4>' +
    '<table style="font-size:12px"><thead><tr><th>接收人</th><th>岗位</th><th>部门</th><th>分配物资</th><th>签收状态</th><th>签收时间</th></tr></thead><tbody>' +
    d.recipients.map(r => '<tr><td><strong>' + r.name + '</strong></td><td>' + r.position + '</td><td>' + r.department + '</td><td style="max-width:140px">' + (r.items || '待分配') + '</td>' +
      '<td><span class="tag ' + (r.status === '已接收' ? 'tag-green' : 'tag-orange') + '">' + r.status + '</span></td>' +
      '<td>' + (r.receiveTime || '-') + '</td></tr>').join('') +
    '</tbody></table></div>';

  // 四步流程链
  html += '<div><h4 style="margin-bottom:8px">执行流程</h4>';
  d.workflowSteps.forEach(s => {
    const statusColor = s.status === '已完成' ? 'var(--success)' : s.status === '进行中' ? 'var(--primary)' : 'var(--text-tertiary)';
    html += '<div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--border-light);border-radius:8px;margin-bottom:6px">' +
      '<div style="width:32px;height:32px;border-radius:50%;background:' + statusColor + ';color:white;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0">' +
      (s.status === '已完成' ? '&#10003;' : s.step) + '</div>' +
      '<div style="flex:1">' +
      '<div style="font-weight:600">第' + s.step + '步：' + s.name + '</div>' +
      '<div style="font-size:12px;color:var(--text-secondary)">负责人：' + s.assignee + '</div>' +
      '</div>' +
      '<div style="text-align:right">' +
      '<div><span class="tag ' + (s.status === '已完成' ? 'tag-green' : s.status === '进行中' ? 'tag-blue' : s.status === '待执行' ? 'tag-orange' : 'tag-gray') + '">' + s.status + '</span></div>' +
      (s.time ? '<div style="font-size:11px;color:var(--text-tertiary);margin-top:2px">' + s.time + '</div>' : '') +
      (s.note ? '<div style="font-size:11px;color:var(--text-secondary);margin-top:2px">' + s.note + '</div>' : '') +
      '</div></div>';
  });
  html += '</div>';

  openModal('物资发放详情 - ' + d.id, html, [
    { text: '关闭', class: 'btn-default', action: 'closeModal()' }
  ]);
}

// ============ 资产管理 ============
function renderAsset() {
  const inUse = assets.filter(a => a.status === 'in-use').length;
  const idle = assets.filter(a => a.status === 'idle').length;
  const repair = assets.filter(a => a.status === 'repair').length;
  const scrapped = assets.filter(a => a.status === 'scrapped').length;
  const totalValue = assets.reduce((sum, a) => sum + a.cost, 0);

  return `
    <div class="page-header">
      <h2>资产管理</h2>
      <p>公司资产全生命周期管理：采购入库→领用→维修→报废。</p>
    </div>

    <div class="stats-grid" style="margin-bottom:24px">
      <div class="stat-card">
        <div class="stat-icon blue">&#128188;</div>
        <div class="stat-info">
          <div class="stat-label">资产总数</div>
          <div class="stat-value">${assets.length}</div>
          <div class="stat-footer">原值 ${(totalValue/10000).toFixed(1)} 万元</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green">&#9989;</div>
        <div class="stat-info">
          <div class="stat-label">在用</div>
          <div class="stat-value">${inUse}</div>
          <div class="stat-footer">占比 ${Math.round(inUse/assets.length*100)}%</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon orange">&#128295;</div>
        <div class="stat-info">
          <div class="stat-label">维修中</div>
          <div class="stat-value">${repair}</div>
          <div class="stat-footer">闲置 ${idle} 台</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon red">&#128683;</div>
        <div class="stat-info">
          <div class="stat-label">已报废</div>
          <div class="stat-value">${scrapped}</div>
          <div class="stat-footer">待处理 ${idle} 台</div>
        </div>
      </div>
    </div>

    <div class="toolbar">
      <button class="btn btn-primary btn-sm" onclick="showAddAssetModal()">+ 新增资产</button>
      <select class="form-select" style="width:150px" onchange="filterAssets(this.value)">
        <option value="all">全部分类</option>
        <option value="vehicle">车辆</option>
        <option value="equipment">设备</option>
        <option value="tool">工具</option>
        <option value="office">办公用品</option>
      </select>
    </div>

    <div class="card">
      <div class="card-body no-padding">
        <table id="assetTable">
          <thead>
            <tr>
              <th>资产编号</th>
              <th>名称</th>
              <th>分类</th>
              <th>规格</th>
              <th>原值(元)</th>
              <th>状态</th>
              <th>存放位置</th>
              <th>负责人</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
            ${assets.map(a => {
              const cat = assetCategories.find(c => c.id === a.category);
              const statusInfo = assetStatusMap[a.status];
              return '<tr>' +
                '<td><strong>' + a.id + '</strong></td>' +
                '<td>' + cat.icon + ' ' + a.name + '</td>' +
                '<td>' + cat.name + '</td>' +
                '<td style="font-size:12px;color:var(--text-secondary)">' + a.spec + '</td>' +
                '<td style="text-align:right">' + a.cost.toLocaleString() + '</td>' +
                '<td><span class="tag ' + statusInfo.color + '">' + statusInfo.label + '</span></td>' +
                '<td>' + a.location + '</td>' +
                '<td>' + employeeLink(a.responsibleId) + '</td>' +
                '<td>' +
                  '<button class="btn btn-default btn-sm" onclick="showAssetDetail(\'' + a.id + '\')">详情</button> ' +
                  (a.status === 'idle' ? '<button class="btn btn-primary btn-sm" onclick="changeAssetStatus(\'' + a.id + '\', \'in-use\')">领用</button>' :
                   a.status === 'in-use' ? '<button class="btn btn-warning btn-sm" onclick="changeAssetStatus(\'' + a.id + '\', \'repair\')">报修</button> <button class="btn btn-default btn-sm" onclick="changeAssetStatus(\'' + a.id + '\', \'idle\')">归还</button>' :
                   a.status === 'repair' ? '<button class="btn btn-default btn-sm" onclick="changeAssetStatus(\'' + a.id + '\', \'idle\')">修完归还</button>' : '') +
                '</td></tr>';
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}

function filterAssets(category) {
  const rows = document.querySelectorAll('#assetTable tbody tr');
  rows.forEach(row => {
    if (category === 'all') {
      row.style.display = '';
    } else {
      const catName = assetCategories.find(c => c.id === category).name;
      row.style.display = row.textContent.includes(catName) ? '' : 'none';
    }
  });
}

function showAssetDetail(assetId) {
  const a = assets.find(x => x.id === assetId);
  if (!a) return;
  const cat = assetCategories.find(c => c.id === a.category);
  const statusInfo = assetStatusMap[a.status];

  let html = '<div style="margin-bottom:16px">' +
    '<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">' +
    '<span class="tag tag-blue">' + a.id + '</span>' +
    '<span class="tag ' + statusInfo.color + '">' + statusInfo.label + '</span>' +
    '</div>' +
    '<div class="desc-list">' +
    '<div class="desc-item"><div class="desc-label">资产名称</div><div class="desc-value">' + cat.icon + ' ' + a.name + '</div></div>' +
    '<div class="desc-item"><div class="desc-label">分类</div><div class="desc-value">' + cat.name + '</div></div>' +
    '<div class="desc-item"><div class="desc-label">规格型号</div><div class="desc-value">' + a.spec + '</div></div>' +
    '<div class="desc-item"><div class="desc-label">原值</div><div class="desc-value">' + a.cost.toLocaleString() + ' 元</div></div>' +
    '<div class="desc-item"><div class="desc-label">购入日期</div><div class="desc-value">' + a.purchaseDate + '</div></div>' +
    '<div class="desc-item"><div class="desc-label">折旧月数</div><div class="desc-value">' + a.depreciationMonths + ' 个月</div></div>' +
    '<div class="desc-item"><div class="desc-label">存放位置</div><div class="desc-value">' + a.location + '</div></div>' +
    '<div class="desc-item"><div class="desc-label">负责人</div><div class="desc-value">' + employeeLink(a.responsibleId) + '</div></div>' +
    (a.plateNumber ? '<div class="desc-item"><div class="desc-label">车牌号</div><div class="desc-value">' + a.plateNumber + '</div></div>' : '') +
    (a.assetTag ? '<div class="desc-item"><div class="desc-label">资产标签</div><div class="desc-value">' + a.assetTag + '</div></div>' : '') +
    '</div></div>';

  if (a.maintenanceRecords && a.maintenanceRecords.length > 0) {
    html += '<div><h4 style="margin-bottom:8px">维护/维修记录</h4>' +
      '<table style="font-size:12px"><thead><tr><th>日期</th><th>类型</th><th>费用</th><th>说明</th></tr></thead><tbody>' +
      a.maintenanceRecords.map(r => '<tr><td>' + r.date + '</td><td><span class="tag ' + (r.type === '维修' ? 'tag-orange' : r.type === '保养' ? 'tag-blue' : 'tag-red') + '">' + r.type + '</span></td>' +
        '<td style="text-align:right">' + (r.cost > 0 ? r.cost + ' 元' : '-') + '</td><td>' + r.desc + '</td></tr>').join('') +
      '</tbody></table></div>';
  }

  openModal('资产详情 - ' + a.name, html, [
    { text: '关闭', class: 'btn-default', action: 'closeModal()' }
  ]);
}

function changeAssetStatus(assetId, newStatus) {
  const a = assets.find(x => x.id === assetId);
  if (!a) return;
  const statusLabels = { 'idle': '闲置', 'in-use': '在用', 'repair': '维修中', 'scrapped': '已报废' };
  if (confirm('确认将资产 ' + a.name + ' 状态变更为【' + statusLabels[newStatus] + '】？')) {
    a.status = newStatus;
    if (newStatus === 'idle') a.location = '仓库';
    alert('资产状态已更新！');
    navigateTo('asset');
  }
}

function showAddAssetModal() {
  let html = '<div class="form-row">' +
    '<div class="form-item"><label>资产名称</label><input type="text" class="form-input" id="newAssetName" placeholder="请输入资产名称"></div>' +
    '<div class="form-item"><label>分类</label><select class="form-select" id="newAssetCategory">' +
    assetCategories.map(c => '<option value="' + c.id + '">' + c.name + '</option>').join('') +
    '</select></div></div>' +
    '<div class="form-row">' +
    '<div class="form-item"><label>规格型号</label><input type="text" class="form-input" id="newAssetSpec" placeholder="请输入规格型号"></div>' +
    '<div class="form-item"><label>原值(元)</label><input type="number" class="form-input" id="newAssetCost" placeholder="请输入购入价格"></div></div>' +
    '<div class="form-row">' +
    '<div class="form-item"><label>购入日期</label><input type="date" class="form-input" id="newAssetDate"></div>' +
    '<div class="form-item"><label>存放位置</label><input type="text" class="form-input" id="newAssetLocation" placeholder="请输入存放位置"></div></div>' +
    '<div class="form-item"><label>负责人</label><select class="form-select" id="newAssetResponsible">' +
    employees.map(e => '<option value="' + e.id + '">' + e.name + '（' + e.department + '）</option>').join('') +
    '</select></div>';

  openModal('新增资产', html, [
    { text: '取消', class: 'btn-default', action: 'closeModal()' },
    { text: '保存', class: 'btn-primary', action: 'saveNewAsset()' }
  ]);
}

function saveNewAsset() {
  const name = document.getElementById('newAssetName').value;
  const category = document.getElementById('newAssetCategory').value;
  const spec = document.getElementById('newAssetSpec').value;
  const cost = parseInt(document.getElementById('newAssetCost').value) || 0;
  const purchaseDate = document.getElementById('newAssetDate').value;
  const location = document.getElementById('newAssetLocation').value;
  const responsibleId = parseInt(document.getElementById('newAssetResponsible').value);
  const responsible = employees.find(e => e.id === responsibleId);

  if (!name || !cost || !purchaseDate) {
    alert('请填写完整信息');
    return;
  }

  const newId = 'AST-' + String(assets.length + 1).padStart(3, '0');
  assets.push({
    id: newId, name: name, category: category, spec: spec,
    purchaseDate: purchaseDate, cost: cost, depreciationMonths: 60,
    status: 'idle', location: location || '仓库', responsibleId: responsibleId, responsible: responsible.name,
    maintenanceRecords: [],
  });

  closeModal();
  alert('资产已添加！编号：' + newId);
  navigateTo('asset');
}

// ============ 库管 ============
function renderWarehouse() {
  const lowStock = inventoryItems.filter(i => i.stock < i.minStock).length;
  const totalValue = inventoryItems.reduce((sum, i) => sum + i.stock * i.cost, 0);
  const todayInbound = inboundRecords.filter(r => r.date === '2026-11-03').length;
  const todayOutbound = outboundRecords.filter(r => r.date === '2026-11-03').length;

  return `
    <div class="page-header">
      <h2>库管</h2>
      <p>库存管理：入库→质检→上架→出库→盘点。</p>
    </div>

    <div class="stats-grid" style="margin-bottom:24px">
      <div class="stat-card">
        <div class="stat-icon blue">&#128230;</div>
        <div class="stat-info">
          <div class="stat-label">库存品种</div>
          <div class="stat-value">${inventoryItems.length}</div>
          <div class="stat-footer">总价值 ${(totalValue/10000).toFixed(1)} 万元</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon orange">&#9888;&#65039;</div>
        <div class="stat-info">
          <div class="stat-label">库存预警</div>
          <div class="stat-value">${lowStock}</div>
          <div class="stat-footer">低于安全库存</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green">&#128229;</div>
        <div class="stat-info">
          <div class="stat-label">今日入库</div>
          <div class="stat-value">${todayInbound}</div>
          <div class="stat-footer">笔</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon red">&#128228;</div>
        <div class="stat-info">
          <div class="stat-label">今日出库</div>
          <div class="stat-value">${todayOutbound}</div>
          <div class="stat-footer">笔</div>
        </div>
      </div>
    </div>

    <div class="tabs" id="warehouseTabs">
      <div class="tab-item active" onclick="switchWarehouseTab('inventory')">库存列表</div>
      <div class="tab-item" onclick="switchWarehouseTab('inbound')">入库记录 (${inboundRecords.length})</div>
      <div class="tab-item" onclick="switchWarehouseTab('outbound')">出库记录 (${outboundRecords.length})</div>
    </div>

    <div id="warehouseContent">
      ${renderWarehouseInventory()}
    </div>`;
}

function switchWarehouseTab(tab) {
  document.querySelectorAll('#warehouseTabs .tab-item').forEach((el, i) => {
    const tabs = ['inventory', 'inbound', 'outbound'];
    el.classList.toggle('active', tabs[i] === tab);
  });
  const contentEl = document.getElementById('warehouseContent');
  switch(tab) {
    case 'inventory': contentEl.innerHTML = renderWarehouseInventory(); break;
    case 'inbound': contentEl.innerHTML = renderWarehouseInbound(); break;
    case 'outbound': contentEl.innerHTML = renderWarehouseOutbound(); break;
  }
}

function renderWarehouseInventory() {
  const lowStockItems = inventoryItems.filter(i => i.stock < i.minStock);

  let html = '<div class="toolbar">' +
    '<button class="btn btn-primary btn-sm" onclick="showInboundModal()">+ 采购入库</button>' +
    '<button class="btn btn-default btn-sm" onclick="showOutboundModal()">+ 其他出库</button>' +
    '</div>';

  if (lowStockItems.length > 0) {
    html += '<div class="card" style="margin-bottom:16px;border:1px solid var(--warning);background:var(--warning-bg)">' +
      '<div class="card-body" style="padding:12px 16px">' +
      '<div style="font-weight:600;color:var(--warning);margin-bottom:8px">&#9888;&#65039; 库存预警（' + lowStockItems.length + '项低于安全库存）</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px">' +
      lowStockItems.map(i => '<span style="background:white;border:1px solid var(--warning);border-radius:4px;padding:4px 10px;font-size:12px">' +
        i.name + '（当前 ' + i.stock + i.unit + '，安全 ' + i.minStock + i.unit + '）</span>').join('') +
      '</div></div></div>';
  }

  html += '<div class="card"><div class="card-body no-padding"><table>' +
    '<thead><tr><th>编号</th><th>名称</th><th>规格</th><th>分类</th><th>库存</th><th>安全库存</th><th>库位</th><th>单价</th><th>操作</th></tr></thead><tbody>';

  inventoryItems.forEach(i => {
    const isLow = i.stock < i.minStock;
    const catLabel = { consumable: '消耗品', tool: '工具', spare: '备件', office: '办公' }[i.category] || i.category;
    html += '<tr>' +
      '<td><strong>' + i.id + '</strong></td>' +
      '<td>' + i.name + '</td>' +
      '<td style="font-size:12px;color:var(--text-secondary)">' + i.spec + '</td>' +
      '<td><span class="tag tag-gray">' + catLabel + '</span></td>' +
      '<td style="' + (isLow ? 'color:var(--danger);font-weight:600' : '') + '">' + i.stock + ' ' + i.unit + '</td>' +
      '<td>' + i.minStock + ' ' + i.unit + '</td>' +
      '<td>' + i.location + '</td>' +
      '<td style="text-align:right">' + i.cost + ' 元</td>' +
      '<td><button class="btn btn-default btn-sm" onclick="showInventoryDetail(\'' + i.id + '\')">详情</button></td></tr>';
  });

  html += '</tbody></table></div></div>';
  return html;
}

function renderWarehouseInbound() {
  let html = '<div class="toolbar"><button class="btn btn-primary btn-sm" onclick="showInboundModal()">+ 采购入库</button></div>';

  html += '<div class="card"><div class="card-body no-padding"><table>' +
    '<thead><tr><th>入库单号</th><th>日期</th><th>类型</th><th>供应商</th><th>物品</th><th>总金额</th><th>状态</th><th>操作人</th><th>操作</th></tr></thead><tbody>';

  inboundRecords.forEach(r => {
    const statusTag = r.status === '已完成' ? '<span class="tag tag-green">已完成</span>' :
                     r.status === '待质检' ? '<span class="tag tag-orange">待质检</span>' :
                     '<span class="tag tag-blue">' + r.status + '</span>';
    html += '<tr>' +
      '<td><strong>' + r.id + '</strong></td>' +
      '<td>' + r.date + '</td>' +
      '<td>' + r.type + '</td>' +
      '<td>' + r.supplier + '</td>' +
      '<td style="max-width:200px;font-size:12px">' + r.items.map(i => i.name + '×' + i.qty + i.unit).join('、') + '</td>' +
      '<td style="text-align:right;font-weight:600">' + r.totalCost.toLocaleString() + ' 元</td>' +
      '<td>' + statusTag + '</td>' +

function submitInbound() {
  const type = document.getElementById('inboundType').value;
  const supplier = document.getElementById('inboundSupplier').value;
  if (!supplier) { alert('请输入供应商名称'); return; }

  const rows = document.querySelectorAll('.inbound-item-row');
  const items = [];
  let totalCost = 0;
  rows.forEach(row => {
    const inputs = row.querySelectorAll('input');
    if (inputs[0].value) {
      const qty = parseInt(inputs[2].value) || 0;
      const cost = parseFloat(inputs[3].value) || 0;
      items.push({ name: inputs[0].value, spec: inputs[1].value, qty: qty, unit: '个', cost: cost, totalCost: qty * cost });
      totalCost += qty * cost;
    }
  });

  if (items.length === 0) { alert('请至少添加一项物品'); return; }

  const newId = 'IN-2026-' + String(inboundRecords.length + 1).padStart(3, '0');
  inboundRecords.unshift({
    id: newId, date: '2026-11-03', type: type, supplier: supplier,
    items: items, totalCost: totalCost, operator: '陈静', status: '待质检',
    qualityCheck: { inspector: '', result: '', note: '' },
  });

  closeModal();
  alert('入库单已提交！单号：' + newId + '\n请进行质检操作。');
  switchWarehouseTab('inbound');
}

function startQualityCheck(inboundId) {
  const r = inboundRecords.find(x => x.id === inboundId);
  if (!r) return;

  let html = '<div style="background:var(--primary-bg);border-radius:8px;padding:12px 16px;margin-bottom:16px">' +
    '<div style="font-weight:600;color:var(--primary);margin-bottom:4px">&#128269; 质检操作</div>' +
    '<div style="font-size:13px;color:var(--text-secondary)">入库单号：' + r.id + ' | 供应商：' + r.supplier + '</div></div>' +
    '<div class="form-item"><label>质检结果</label><select class="form-select" id="qcResult"><option value="合格">合格</option><option value="部分合格">部分合格</option><option value="不合格">不合格</option></select></div>' +
    '<div class="form-item"><label>质检员</label><input type="text" class="form-input" id="qcInspector" placeholder="请输入质检员姓名"></div>' +
    '<div class="form-item"><label>备注</label><textarea class="form-input" id="qcNote" rows="3" placeholder="请输入质检备注..."></textarea></div>';

  openModal('质检 - ' + r.id, html, [
    { text: '取消', class: 'btn-default', action: 'closeModal()' },
    { text: '确认质检', class: 'btn-primary', action: 'confirmQualityCheck(\'' + inboundId + '\')' }
  ]);
}

function confirmQualityCheck(inboundId) {
  const r = inboundRecords.find(x => x.id === inboundId);
  if (!r) return;

  const result = document.getElementById('qcResult').value;
  const inspector = document.getElementById('qcInspector').value;
  const note = document.getElementById('qcNote').value;

  if (!inspector) { alert('请输入质检员姓名'); return; }

  r.qualityCheck = { inspector: inspector, result: result, note: note };
  r.status = '已完成';

  // 更新库存
  r.items.forEach(item => {
    const inv = inventoryItems.find(i => i.id === item.inventoryId);
    if (inv) {
      inv.stock += item.qty;
      inv.lastInbound = '2026-11-03';
    }
  });

  closeModal();
  alert('质检完成！库存已更新。');
  switchWarehouseTab('inbound');
}

function submitOutbound() {
  const type = document.getElementById('outboundType').value;
  const receiver = document.getElementById('outboundReceiver').value;
  if (!receiver) { alert('请输入接收人姓名'); return; }

  const items = [];
  document.querySelectorAll('.outbound-qty').forEach(input => {
    const qty = parseInt(input.value) || 0;
    if (qty > 0) {
      const invId = input.dataset.inventoryId;
      const inv = inventoryItems.find(i => i.id === invId);
      if (inv && qty <= inv.stock) {
        items.push({ inventoryId: invId, name: inv.name, spec: inv.spec, qty: qty, unit: inv.unit });
        inv.stock -= qty;
      }
    }
  });

  if (items.length === 0) { alert('请至少填写一项出库数量'); return; }

  const newId = 'OUT-2026-' + String(outboundRecords.length + 1).padStart(3, '0');
  outboundRecords.unshift({
    id: newId, date: '2026-11-03', type: type,
    items: items, operator: '陈静', receiver: receiver, status: '已完成',
  });

  closeModal();
  alert('出库完成！单号：' + newId);
  switchWarehouseTab('outbound');
}

  return `
    <div class="page-header">
      <h2>待办中心</h2>
      <p>所有到本人节点的待阅、待办事项。</p>
    </div>

      <div class="stat-card">
        <div class="stat-icon red">&#128276;</div>
        <div class="stat-info">
          <div class="stat-label">待办事项</div>
          <div class="stat-value">${pending.filter(t => t.type === '待办').length}</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon orange">&#128064;</div>
        <div class="stat-info">
          <div class="stat-label">待阅事项</div>
          <div class="stat-value">${pending.filter(t => t.type === '待阅').length}</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green">&#9989;</div>
        <div class="stat-info">
          <div class="stat-label">已处理</div>
          <div class="stat-value">${done.length}</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h3>待处理事项</h3>
      </div>
      <div class="card-body no-padding">
        <table>
          <thead>
            <tr><th>事项</th><th>类型</th><th>来源</th><th>模块</th><th>优先级</th><th>截止时间</th><th>操作</th></tr>
          </thead>
          <tbody>
            ${pending.map(t => `
              <tr>
                <td><strong>${t.title}</strong></td>
                <td><span class="tag ${t.type === '待办' ? 'tag-blue' : 'tag-gray'}">${t.type}</span></td>
                <td>${t.from}</td>
                <td>${t.module}</td>
                <td>${getPriorityTag(t.priority)}</td>
                <td>${t.deadline}</td>
                <td>
                  <button class="btn btn-primary btn-sm" onclick="completeTodo(${t.id})">处理</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}

function completeTodo(id) {
  const item = todoItems.find(t => t.id === id);
  if (item) {
    item.status = 'done';
    alert('已处理：' + item.title);
    navigateTo('todo');
  }
}

// ============ 通知 ============
function renderNotifications() {
  const listEl = document.getElementById('notificationList');
  listEl.innerHTML = notifications.map(n => `
    <div class="notification-item ${!n.read ? 'unread' : ''}" onclick="readNotification(${n.id})">
      <div class="notif-title">${!n.read ? '&#128308; ' : ''}${n.title}</div>
      <div style="font-size:13px;color:var(--text-primary);margin:4px 0">${n.content}</div>
      <div class="notif-meta">
        <span>${n.sender}（${n.senderRole}）</span>
        <span>${n.date}</span>
        <span class="tag ${n.priority === '紧急' ? 'tag-red' : n.priority === '重要' ? 'tag-orange' : 'tag-blue'}" style="font-size:11px">${n.priority}</span>
      </div>
    </div>
  `).join('');
}

function toggleNotificationPanel() {
  document.getElementById('notificationPanel').classList.toggle('open');
}

function readNotification(id) {
  const n = notifications.find(x => x.id === id);
  if (n) {
    n.read = true;
    const unread = notifications.filter(x => !x.read).length;
    document.getElementById('notifBadge').textContent = unread;
    document.getElementById('notifBadge').style.display = unread > 0 ? 'block' : 'none';
    renderNotifications();
  }
}

// ============ 模态框 ============
function openModal(title, bodyHtml, buttons) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalFooter').innerHTML = buttons.map(b =>
    `<button class="btn ${b.class}" onclick="${b.action}">${b.text}</button>`
  ).join('');
  document.getElementById('modalOverlay').classList.add('active');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

function closeModalOutside(event) {
  if (event.target === document.getElementById('modalOverlay')) {
    closeModal();
  }
}

// ============ 初始化 ============
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('loginPage').style.display = 'flex';
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closeModal();
    document.getElementById('notificationPanel').classList.remove('open');
  }
  if (e.key === 'Enter' && document.getElementById('loginPage').style.display !== 'none') {
    handleLogin();
  }
});
</script>
