function saveEmployeeCreate() {
  const get = id => (document.getElementById(id).value || '').trim();
  const name = get('ne-name'), position = get('ne-position'), department = get('ne-department');
  const account = get('ne-account'), password = get('ne-password');
  const idNum = parseInt(get('ne-id'), 10);
  if (!name) { alert('请填写姓名'); return; }
  if (!position) { alert('请填写岗位'); return; }
  if (!department) { alert('请选择部门'); return; }
  if (!account) { alert('请填写登录账号'); return; }
  if (employees.some(e => e.account === account)) { alert('账号已存在，请更换'); return; }
  if (employees.some(e => e.id === idNum)) { alert('工号已存在，请更换'); return; }
  if (!password || password.length < 6) { alert('密码至少6位'); return; }
  const emp = {
    id: idNum,
    name: name,
    gender: get('ne-gender'),
    age: parseInt(get('ne-age'), 10) || 30,
    position: position,
    department: department,
    phone: get('ne-phone') || '-',
    joinDate: get('ne-joinDate') || new Date().toISOString().slice(0,10),
    education: get('ne-education'),
    type: get('ne-type'),
    status: '在职',
    account: account,
    password: password,
    accountStatus: get('ne-accountStatus') || 'active',
    mustChangePwd: get('ne-mustChangePwd') === '1',
    lastLogin: null,
    loginFailCount: 0,
    accountCreatedAt: new Date().toISOString().slice(0,10),
    accountCreatedBy: (currentUser && currentUser.name) || '管理员'
  };
  employees.push(emp);
  if (typeof collectSyncPayload === 'function') { try { localStorage.setItem(MOBILE_SYNC_KEY, JSON.stringify(collectSyncPayload())); } catch(x){} }
  closeModal();
  showToast('已新增员工 ' + name + '，账号 ' + account + ' 已开通');
  switchPersonnelTab('accounts');
}

          <option value="disabled" ${e.accountStatus==='disabled'?'selected':''}>停用</option>
          <option value="locked" ${e.accountStatus==='locked'?'selected':''}>锁定</option>
        </select>
      </div>
      <div class="form-item"><label class="form-label">首次登录强制改密</label>
        <select class="form-select" id="ae-mustChangePwd">

    { text: '取消', class: 'btn-default', action: 'closeModal()' },
    { text: '保存', class: 'btn-primary', action: 'saveAccountEdit(' + id + ')' }
  ]);
}
function saveAccountEdit(id) {
  const e = employees.find(x => x.id === id);
  if (!e) return;
  const newAcc = (document.getElementById('ae-account').value || '').trim();
  const newPwd = document.getElementById('ae-password').value || '';
  if (!newAcc) { alert('账号不能为空'); return; }
  if (employees.some(x => x.account === newAcc && x.id !== id)) { alert('账号已被他人占用'); return; }
  if (newPwd && newPwd.length < 6) { alert('密码至少6位'); return; }
  const oldAcc = e.account;
  e.account = newAcc;
  if (newPwd) { e.password = newPwd; e.mustChangePwd = true; }
  e.accountStatus = document.getElementById('ae-accountStatus').value;
  e.mustChangePwd = document.getElementById('ae-mustChangePwd').value === '1';
  e.loginFailCount = parseInt(document.getElementById('ae-loginFailCount').value, 10) || 0;
  if (typeof collectSyncPayload === 'function') { try { localStorage.setItem(MOBILE_SYNC_KEY, JSON.stringify(collectSyncPayload())); } catch(x){} }
  closeModal();
  showToast(oldAcc !== newAcc ? '账号已更新：' + oldAcc + ' → ' + newAcc : '账号已保存');
  switchPersonnelTab('accounts');
}

function resetEmployeePassword(id) {
  const e = employees.find(x => x.id === id);
  if (!e) return;
  openModal('重置密码 - ' + e.name + '（' + e.account + '）', `
    <div class="alert alert-warning" style="margin-bottom:12px">
      &#9888;&#65039; 重置后旧密码立即失效，请通过安全渠道告知员工新密码。默认会将"首次登录强制改密"设为是。
    </div>
    <div class="form-item"><label class="form-label">新密码</label>
      <input type="text" class="form-input" id="rp-newpwd" value="Aa@123456" placeholder="至少6位">
      <div class="form-hint">建议使用默认 Aa@123456，员工首次登录后自行修改</div>
    </div>
    <div class="form-item" style="margin-top:12px"><label class="form-label">
      <input type="checkbox" id="rp-mustChange" checked> 强制员工首次登录修改密码
    </label></div>
    <div class="form-item" style="margin-top:8px"><label class="form-label">
      <input type="checkbox" id="rp-unlock" checked> 同时解除锁定状态、清零失败次数
    </label></div>
  `, [
    { text: '取消', class: 'btn-default', action: 'closeModal()' },
    { text: '确认重置', class: 'btn-primary', action: 'doResetPassword(' + id + ')' }
  ]);
}
function doResetPassword(id) {
  const e = employees.find(x => x.id === id);
  if (!e) return;
  const p = document.getElementById('rp-newpwd').value || '';
  if (p.length < 6) { alert('密码至少6位'); return; }
  e.password = p;
  e.mustChangePwd = document.getElementById('rp-mustChange').checked;
  if (document.getElementById('rp-unlock').checked) {
    e.accountStatus = 'active';
    e.loginFailCount = 0;
  }
  if (typeof collectSyncPayload === 'function') { try { localStorage.setItem(MOBILE_SYNC_KEY, JSON.stringify(collectSyncPayload())); } catch(x){} }
  closeModal();
  showToast('已重置 ' + e.name + ' 的密码为 ' + p);
  switchPersonnelTab('accounts');
}

function toggleAccountStatus(id) {
  const e = employees.find(x => x.id === id);
  if (!e) return;
  e.accountStatus = (e.accountStatus === 'active') ? 'disabled' : 'active';
  if (e.accountStatus === 'active') e.loginFailCount = 0;
  if (typeof collectSyncPayload === 'function') { try { localStorage.setItem(MOBILE_SYNC_KEY, JSON.stringify(collectSyncPayload())); } catch(x){} }
  showToast('账号 ' + e.account + ' 已' + (e.accountStatus === 'active' ? '启用' : '停用'));
  switchPersonnelTab('accounts');
}

function unlockAccount(id) {
  const e = employees.find(x => x.id === id);
  if (!e) return;
  e.accountStatus = 'active';
  e.loginFailCount = 0;
  if (typeof collectSyncPayload === 'function') { try { localStorage.setItem(MOBILE_SYNC_KEY, JSON.stringify(collectSyncPayload())); } catch(x){} }
  showToast('账号 ' + e.account + ' 已解锁');
  switchPersonnelTab('accounts');
}

function batchInitAccounts() {
  if (!confirm('确认将所有员工密码批量重置为默认 Aa@123456？\n该操作会强制所有员工下次登录修改密码。')) return;
  employees.forEach(e => {
    e.password = 'Aa@123456';
    e.mustChangePwd = true;
    e.loginFailCount = 0;
    if (e.accountStatus === 'locked') e.accountStatus = 'active';
  });
  if (typeof collectSyncPayload === 'function') { try { localStorage.setItem(MOBILE_SYNC_KEY, JSON.stringify(collectSyncPayload())); } catch(x){} }
  showToast('已批量重置 ' + employees.length + ' 个账号密码');
  switchPersonnelTab('accounts');
}

function exportAccounts() {
  const header = ['工号','姓名','岗位','部门','账号','初始密码','状态','首次改密','失败次数','最近登录','创建时间','创建人','手机'];
  const rows = employees.map(e => [
    String(e.id).padStart(4,'0'),
    e.name, e.position, e.department,
    e.account, e.password,
    e.accountStatus === 'active' ? '启用' : e.accountStatus === 'disabled' ? '停用' : '锁定',
    e.mustChangePwd ? '待修改' : '已修改',
    e.loginFailCount || 0,
    e.lastLogin ? new Date(e.lastLogin).toLocaleString('zh-CN',{hour12:false}) : '从未登录',
    e.accountCreatedAt || '-',
    e.accountCreatedBy || '-',
    e.phone || '-'
  ]);
  const csv = '\uFEFF' + [header].concat(rows).map(r => r.map(x => '"' + String(x).replace(/"/g, '""') + '"').join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'APP账号清单-' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('账号清单已导出（CSV）');
}

function renderWorkflow() {
  return `
    <div class="page-header">
      <h2>审批流程</h2>
      <p>请假、出差、用印、采购、维修等各类审批流程管理。</p>
    </div>

    <div class="tabs" id="workflowTabs">
      <div class="tab-item active" onclick="switchWorkflowTab('pending')">待我审批</div>
      <div class="tab-item" onclick="switchWorkflowTab('mine')">我的申请</div>
      <div class="tab-item" onclick="switchWorkflowTab('all')">全部流程</div>
    </div>

    <div id="workflowContent">
      ${renderWorkflowPending()}
    </div>`;
}

function switchWorkflowTab(tab) {
  document.querySelectorAll('#workflowTabs .tab-item').forEach((el, i) => {
    const tabs = ['pending', 'mine', 'all'];
    el.classList.toggle('active', tabs[i] === tab);
  });

  const contentEl = document.getElementById('workflowContent');
  switch(tab) {
    case 'pending': contentEl.innerHTML = renderWorkflowPending(); break;
    case 'mine': contentEl.innerHTML = renderWorkflowMine(); break;
    case 'all': contentEl.innerHTML = renderWorkflowAll(); break;
  }
}

function renderWorkflowPending() {
  const pending = workflowRecords.filter(w => w.status === '审批中');
  return `
    <div class="toolbar">
      <button class="btn btn-primary btn-sm" onclick="showNewWorkflowModal()">+ 发起申请</button>
    </div>
    ${pending.length === 0 ? '<div class="empty-state"><div class="empty-icon">&#9989;</div><p>暂无待审批事项</p></div>' :
    pending.map(w => `

// 全选/清空/按部门选 作业单位
function toggleAllUnits(checked) {
  document.querySelectorAll('.unit-checkbox').forEach(cb => { cb.checked = checked; });
  previewRecipients();
}
function toggleDeptUnits(dept) {
  document.querySelectorAll('.unit-checkbox').forEach(cb => {
    const unit = workUnits.find(u => u.id === cb.value);
    if (unit) cb.checked = (unit.dept === dept);
  });
  previewRecipients();

function previewRecipients() {
  const previewEl = document.getElementById('recipientPreview');
  if (!previewEl) return;

  // 获取选中的单位
  const checkedBoxes = document.querySelectorAll('.unit-checkbox:checked');
  const selectedUnitIds = Array.from(checkedBoxes).map(cb => cb.value);

  if (selectedUnitIds.length === 0) {
    previewEl.innerHTML = '<div style="background:var(--bg-page);border-radius:8px;padding:16px;text-align:center;color:var(--text-tertiary);font-size:13px">请勾选至少一个作业单位</div>';
    return;
  }

  // 获取每人物品清单
  const rows = document.querySelectorAll('.material-item-row');
  const perPersonItems = [];
  rows.forEach(row => {
    const inputs = row.querySelectorAll('input');
    if (inputs[0].value) {
      perPersonItems.push({ name: inputs[0].value, spec: inputs[1].value, qty: parseInt(inputs[2].value) || 0, unit: inputs[3].value });
    }
  });

  // 自动匹配接收人
  const matchResult = autoMatchRecipients('units', selectedUnitIds);
  const totalPeople = matchResult.totalPeople;
  const recipients = matchResult.recipients;
  const selectedUnits = matchResult.selectedUnits;

  // 计算总量
  const totalItems = calcTotalFromUnits(selectedUnitIds, perPersonItems);

  let html = '<div style="background:var(--success-bg);border:1px solid #b7eb8f;border-radius:8px;padding:14px 16px">';

  // 选中单位概览
  html += '<div style="font-weight:600;margin-bottom:8px;color:var(--success)">&#128230; 发放概览</div>';
  html += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px">' +
    '<div style="background:white;border-radius:6px;padding:10px;text-align:center"><div style="font-size:24px;font-weight:700;color:var(--primary)">' + selectedUnits.length + '</div><div style="font-size:12px;color:var(--text-secondary)">作业单位</div></div>' +
    '<div style="background:white;border-radius:6px;padding:10px;text-align:center"><div style="font-size:24px;font-weight:700;color:var(--success)">' + totalPeople + '</div><div style="font-size:12px;color:var(--text-secondary)">覆盖人数</div></div>' +
    '<div style="background:white;border-radius:6px;padding:10px;text-align:center"><div style="font-size:24px;font-weight:700;color:var(--warning)">' + recipients.length + '</div><div style="font-size:12px;color:var(--text-secondary)">接收人</div></div>' +
    '</div>';

  // 汇总总量
  if (totalItems.length > 0) {
    html += '<div style="background:white;border-radius:6px;padding:10px 14px;margin-bottom:10px">' +
      '<div style="font-weight:600;font-size:13px;margin-bottom:6px">&#128202; 物资总量汇总（每人 × ' + totalPeople + '人）</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:6px">' +
      totalItems.map(i => '<span style="display:inline-block;background:var(--primary-bg);border-radius:4px;padding:3px 10px;font-size:12px;color:var(--primary);font-weight:500">' +
        i.name + (i.spec ? '(' + i.spec + ')' : '') + ' ' + i.qty + i.unit +
        ' <span style="color:var(--text-tertiary);font-weight:normal">= ' + i.perPersonQty + i.unit + '/人</span></span>').join('') +
      '</div></div>';
  }

  // 接收人列表
  html += '<div style="background:white;border-radius:6px;padding:10px 14px">' +
    '<div style="font-weight:600;font-size:13px;margin-bottom:6px">&#128101; 自动匹配接收人（单位主管）</div>';
  recipients.forEach(r => {
    html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--border-light);font-size:12px">' +
      '<div><strong>' + r.name + '</strong>（' + r.position + '）' +
      '<span style="color:var(--text-secondary);margin-left:6px">' + r.units.join('、') + '</span></div>' +
      '<span style="color:var(--text-tertiary)">' + r.peopleCount + '人</span></div>';
  });
  html += '</div></div>';

  previewEl.innerHTML = html;
}

function submitWorkflow() {
  const typeEl = document.getElementById('wfType');
  const type = typeEl ? typeEl.value : '';

  if (type === 'material') {
    // 收集选中的作业单位
    const selectedUnitIds = Array.from(document.querySelectorAll('.unit-checkbox:checked')).map(cb => cb.value);
    if (selectedUnitIds.length === 0) { alert('请至少选择一个作业单位'); return; }

    // 收集每人物资清单
    const rows = document.querySelectorAll('.material-item-row');
    const perPersonItems = [];
    rows.forEach(row => {
      const inputs = row.querySelectorAll('input');
      if (inputs[0].value) {
        perPersonItems.push({ name: inputs[0].value, spec: inputs[1].value, qty: parseInt(inputs[2].value) || 0, unit: inputs[3].value });
      }
    });
    if (perPersonItems.length === 0) { alert('请至少添加一项物资'); return; }

    const distributorId = parseInt(document.getElementById('mdDistributor').value);
    const distributor = grassrootsManagers.find(m => m.id === distributorId);
    const totalCost = parseInt(document.getElementById('mdTotalCost').value) || 0;

    // 自动匹配接收人和计算总量
    const matchResult = autoMatchRecipients('units', selectedUnitIds);
    const recipients = matchResult.recipients;
    const totalPeople = matchResult.totalPeople;
    const selectedUnits = matchResult.selectedUnits;
    const totalItems = calcTotalFromUnits(selectedUnitIds, perPersonItems);

    // 创建新的物资发放记录
    const newId = 'MD-2026-' + String(materialDistributions.length + 1).padStart(3, '0');
    const newWfId = 'WF-2026-' + String(workflowRecords.length + 1).padStart(3, '0');
    const scopeDesc = selectedUnits.map(u => u.name).join('、');

    const newDist = {
      id: newId, applicantId: currentUser.name === '李明' ? 2 : 4, applicant: currentUser.name,
      department: currentUser.department, date: '2026-11-03',
      perPersonItems: perPersonItems, items: totalItems, totalCost: totalCost,
      scope: 'units', scopeDesc: scopeDesc, selectedUnitIds: selectedUnitIds,
      distributorId: distributorId, distributor: distributor.name, distributorRole: distributor.position,
      recipients: recipients, totalPeople: totalPeople,
      workflowSteps: generateDistributionWorkflow({ distributorId: distributorId, distributor: distributor.name }),
      approvalId: newWfId, status: '待审批', currentStep: 0, totalSteps: 4,
    };
    materialDistributions.push(newDist);

    // 同时创建审批流程记录
    const newWf = {
      id: newWfId, type: '物资发放', applicantId: newDist.applicantId, applicant: currentUser.name,
      department: currentUser.department, date: '2026-11-03',
      distributionId: newId, items: totalItems.map(i => i.name + i.qty + i.unit).join('、'),
      totalCost: totalCost, distributor: distributor.name, scopeDesc: scopeDesc,
      approver: '王芳', status: '审批中', currentStep: 1, totalSteps: 2,
    };
    workflowRecords.unshift(newWf);

    alert('物资发放申请已提交！覆盖 ' + selectedUnits.length + ' 个单位、' + totalPeople + ' 人，系统将在审批通过后自动生成出库→接收→移交→签收四步流程。');
    closeModal();
    navigateTo('material-dist');
    return;
  }

  if (type === 'requisition') {
    // 收集领取物品清单
    const rows = document.querySelectorAll('.requisition-item-row');
    const items = [];
    rows.forEach(row => {
      const inputs = row.querySelectorAll('input');
      if (inputs[0].value) {
        items.push({ name: inputs[0].value, spec: inputs[1].value, qty: parseInt(inputs[2].value) || 0, unit: inputs[3].value });
      }
    });
    if (items.length === 0) { alert('请至少添加一项领取物品'); return; }

    const urgency = document.getElementById('reqUrgency').value;
    const reqType = document.getElementById('reqType').value;
    const reason = document.getElementById('reqReason') ? document.getElementById('reqReason').value : '';

    // 创建物料领取记录
    const newMrId = 'MR-2026-' + String(materialRequisitions.length + 1).padStart(3, '0');
    const newWfId = 'WF-2026-' + String(workflowRecords.length + 1).padStart(3, '0');
    const applicantId = currentUser.name === '林小红' ? 13 : currentUser.name === '孙磊' ? 7 : currentUser.name === '胡明' ? 16 : 13;

    const newReq = {
      id: newMrId, applicantId: applicantId, applicant: currentUser.name,
      position: currentUser.role, department: currentUser.department, date: '2026-11-03',
      items: items, urgency: urgency, reqType: reqType, reason: reason,
      approver: '郑华', status: '待审批',
      approvalId: newWfId, workflowSteps: [], currentStep: 0, totalSteps: 2,
    };
    materialRequisitions.push(newReq);

    // 创建审批流程记录
    const newWf = {
      id: newWfId, type: '物料领取', applicantId: applicantId, applicant: currentUser.name,
      department: currentUser.department, date: '2026-11-03',
      requisitionId: newMrId, items: items.map(i => i.name + i.qty + i.unit).join('、'),
      urgency: urgency, reqType: reqType, reason: reason,
      approver: '郑华', status: '审批中', currentStep: 1, totalSteps: 2,
    };
    workflowRecords.unshift(newWf);

    alert('物料领取申请已提交！审批通过后将自动生成：仓库出库→领取人签收 两步流程。');
    closeModal();
    navigateTo('material-dist');
    return;
  }

  alert('申请已提交，等待审批。');
  closeModal();
}

function approveWorkflow(id) {
  const w = workflowRecords.find(x => x.id === id);
  if (!w) return;

  if (w.type === '物资发放' && w.distributionId) {
    if (confirm('确认通过该物资发放申请？\n\n通过后将自动生成四步执行流程：\n1. 仓库出库\n2. 发放人接收\n3. 发放人移交\n4. 接收人接收')) {
      w.status = '已批准';
      w.currentStep = w.totalSteps;
      // 更新物资发放记录状态
      const dist = materialDistributions.find(d => d.id === w.distributionId);
      if (dist) {
        dist.status = '已批准';
        dist.workflowSteps = generateDistributionWorkflow(dist);
        dist.workflowSteps[0].status = '待执行'; // 第一步等待仓库执行
        dist.currentStep = 1;
      }
      alert('物资发放申请已批准！四步执行流程已自动生成，请前往"物资发放"模块跟踪进度。');
      navigateTo('material-dist');
    }
  } else if (w.type === '物料领取' && w.requisitionId) {
    if (confirm('确认通过该物料领取申请？\n\n通过后将自动生成两步执行流程：\n1. 仓库出库\n2. 领取人签收')) {
      w.status = '已批准';
      w.currentStep = w.totalSteps;
      const req = materialRequisitions.find(r => r.id === w.requisitionId);
      if (req) {
        req.status = '已批准';
        req.workflowSteps = generateRequisitionWorkflow(req);
        req.workflowSteps[0].status = '进行中';
        req.currentStep = 1;
      }
      alert('物料领取申请已批准！两步执行流程已自动生成。');
      navigateTo('material-dist');
    }
  } else {
    if (confirm('确认通过该审批？')) {
      w.status = '已批准';
      w.currentStep = w.totalSteps;
      alert('已通过审批 ' + id);
      navigateTo('workflow');
    }
  }
}

function rejectWorkflow(id) {
  if (confirm('确认驳回该审批？')) {
    alert('已驳回审批 ' + id);
    navigateTo('workflow');
  }
}

    <div class="workflow-timeline">
      <div class="workflow-step">
        <div class="step-dot done">&#10003;</div>
        <div class="step-content">
          <div class="step-title">提交申请</div>
          <div class="step-desc">${w.applicant} 于 ${w.date} 提交</div>
        </div>
      </div>`;

  for (let i = 1; i <= w.totalSteps; i++) {
    const isDone = i < w.currentStep || w.status === '已批准';
    const isActive = i === w.currentStep && w.status === '审批中';
    const dotClass = isDone ? 'done' : isActive ? 'active' : 'pending';
    const icon = isDone ? '&#10003;' : i;
    detailHtml += `
      <div class="workflow-step">
        <div class="step-dot ${dotClass}">${icon}</div>
        <div class="step-content">
          <div class="step-title">审批节点 ${i}</div>
          <div class="step-desc">${isDone ? '已审批通过' : isActive ? '等待审批中...' : '待审批'}</div>
        </div>
      </div>`;
  }

  detailHtml += '</div>';

  openModal('流程详情', detailHtml, [{ text: '关闭', class: 'btn-default', action: 'closeModal()' }]);
}

// ============ 物资发放独立模块 ============
function renderMaterialDist() {
  const active = materialDistributions.filter(d => d.status !== '已完成');
  const completed = materialDistributions.filter(d => d.status === '已完成');

  return `
    <div class="page-header">
      <h2>物资发放</h2>
      <p>批量物资发放全流程管理：申请→审批→出库→接收→移交→签收。</p>
    </div>

    <div class="tabs" id="matDistTabs">
      <div class="tab-item active" onclick="switchMatDistTab('active')">发放进行中 (${active.length})</div>
      <div class="tab-item" onclick="switchMatDistTab('completed')">发放已完成 (${completed.length})</div>
      <div class="tab-item" onclick="switchMatDistTab('requisitions')">领取记录 (${materialRequisitions.length})</div>
      <div class="tab-item" onclick="switchMatDistTab('all')">全部发放</div>
    </div>

    <div id="matDistContent">
      ${renderMatDistActive()}
    </div>`;
}

function switchMatDistTab(tab) {
  document.querySelectorAll('#matDistTabs .tab-item').forEach((el, i) => {
    const tabs = ['active', 'completed', 'requisitions', 'all'];
    el.classList.toggle('active', tabs[i] === tab);
  });
  const contentEl = document.getElementById('matDistContent');
  switch(tab) {
    case 'active': contentEl.innerHTML = renderMatDistActive(); break;
    case 'completed': contentEl.innerHTML = renderMatDistCompleted(); break;
    case 'requisitions': contentEl.innerHTML = renderMatDistRequisitions(); break;
    case 'all': contentEl.innerHTML = renderMatDistAll(); break;
  }
}

function renderMatDistActive() {
  const active = materialDistributions.filter(d => d.status !== '已完成');
  if (active.length === 0) return '<div class="empty-state"><div class="empty-icon">&#128230;</div><p>暂无进行中的物资发放</p></div>';

  return active.map(d => renderMatDistCard(d)).join('');
}

function renderMatDistCompleted() {
  const completed = materialDistributions.filter(d => d.status === '已完成');
  if (completed.length === 0) return '<div class="empty-state"><div class="empty-icon">&#9989;</div><p>暂无已完成的物资发放</p></div>';

  return completed.map(d => renderMatDistCard(d)).join('');
}

function renderMatDistAll() {
  return materialDistributions.map(d => renderMatDistCard(d)).join('');
}

        '<button class="btn btn-default btn-sm" onclick="showRequisitionDetail(\'' + r.id + '\')">详情</button></td></tr>';

  // 进行中

    html += '<div class="card" style="margin-bottom:16px"><div class="card-header"><h3>待执行 (' + inProgress.length + ')</h3></div><div class="card-body no-padding"><table><thead><tr>' +
      '<th>编号</th><th>领取人</th><th>物品</th><th>进度</th><th>当前步骤</th><th>操作</th></tr></thead><tbody>';
    inProgress.forEach(r => {

        '<td>' + (currentStepObj ? currentStepObj.name + '（' + currentStepObj.assignee + '）' : '-') + '</td>' +
        '<td>';
      if (currentStepObj) {
        if (currentStepObj.step === 1) {
          html += '<button class="btn btn-primary btn-sm" onclick="executeReqStep(\'' + r.id + '\', 1)">确认出库</button> ';

      }
      html += '<button class="btn btn-default btn-sm" onclick="showRequisitionDetail(\'' + r.id + '\')">详情</button></td></tr>';

    html += '<div class="empty-state"><div class="empty-icon">&#128230;</div><p>暂无物料领取记录</p></div>';

  return html;

// 审批通过物料领取
function approveRequisition(reqId) {
  const r = materialRequisitions.find(x => x.id === reqId);
  if (!r) return;
  if (confirm('确认通过 ' + r.applicant + ' 的物料领取申请？\n通过后将自动生成：仓库出库→领取人签收 两步流程。')) {
    r.status = '已批准';
    r.workflowSteps = generateRequisitionWorkflow(r);
    r.workflowSteps[0].status = '进行中';
    r.currentStep = 1;
    if (r.approvalId) {
      const wf = workflowRecords.find(w => w.id === r.approvalId);
      if (wf) { wf.status = '已批准'; wf.currentStep = wf.totalSteps; }
    }
    alert('已批准！仓库出库步骤已激活。');
    switchMatDistTab('requisitions');
  }
}

// 执行领取流程步骤
function executeReqStep(reqId, stepNum) {
  const r = materialRequisitions.find(x => x.id === reqId);
  if (!r) return;
  const step = r.workflowSteps.find(s => s.step === stepNum);
  if (!step || step.status !== '进行中') return;

  const now = new Date();
  const timeStr = now.toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
  const msg = stepNum === 1 ? '确认仓库已出库？' : '确认 ' + r.applicant + ' 已签收领取物品？';

  if (confirm(msg)) {
    step.status = '已完成';
    step.time = timeStr;
    step.note = '已确认';
    r.currentStep = stepNum + 1;
    if (stepNum < 2) {
      const nextStep = r.workflowSteps.find(s => s.step === stepNum + 1);
      if (nextStep) nextStep.status = '进行中';
    }
    if (stepNum === 2) {
      r.status = '已完成';
      alert('领取人已签收，物料领取流程完成！');
    } else {
      alert('仓库出库完成！下一步：' + r.applicant + ' 签收确认。');
    }
    switchMatDistTab('requisitions');
  }
}

// 执行流程步骤
function executeMatDistStep(distId, stepNum) {
  const d = materialDistributions.find(x => x.id === distId);
  if (!d) return;

  const step = d.workflowSteps.find(s => s.step === stepNum);
  if (!step || step.status !== '进行中') return;

  const now = new Date();
  const timeStr = now.toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });

  if (stepNum === 1) {
    // 仓库出库
    if (confirm('确认仓库已出库？\n\n出库后发放人（' + d.distributor + '）将接收到物资。')) {
      step.status = '已完成';
      step.time = timeStr;
      step.note = '已出库，发放人待接收';
      d.currentStep = 2;
      const nextStep = d.workflowSteps.find(s => s.step === 2);
      if (nextStep) {
        nextStep.status = '进行中';
        nextStep.note = '待发放人确认接收';
      }
      d.status = '发放中';
      alert('【仓库出库】已完成！\n\n发放人 ' + d.distributor + ' 已收到待办通知：确认接收物资。');
      switchMatDistTab('active');
    }
  } else if (stepNum === 2) {
    // 发放人接收
    if (confirm('发放人 ' + step.assignee + ' 确认接收物资？\n\n接收后可开始向各接收人移交。')) {
      step.status = '已完成';
      step.time = timeStr;
      step.note = '已接收，待移交';
      d.currentStep = 3;
      const nextStep = d.workflowSteps.find(s => s.step === 3);
      if (nextStep) {
        nextStep.status = '进行中';
        nextStep.note = '待发放人选择接收人并移交';
      }
      alert('【发放人接收】已完成！\n\n' + d.distributor + ' 已收到待办通知：选择接收人并移交物资。');
      switchMatDistTab('active');
    }
  } else if (stepNum === 3) {
    // 发放人移交 - 打开移交选择弹窗
    showTransferModal(distId);
  }
}

// 发放人移交弹窗 - 选择接收人并移交
function showTransferModal(distId) {
  const d = materialDistributions.find(x => x.id === distId);
  if (!d) return;

  const step3 = d.workflowSteps.find(s => s.step === 3);
  const pendingRecipients = d.recipients.filter(r => r.status === '待接收');

  let html = '<div style="margin-bottom:16px">' +
    '<div style="background:var(--primary-bg);border-radius:8px;padding:12px 16px;margin-bottom:12px">' +
    '<div style="font-weight:600;color:var(--primary);margin-bottom:4px">&#128230; 发放人移交物资</div>' +
    '<div style="font-size:13px;color:var(--text-secondary)">发放人 <strong>' + d.distributor + '</strong> 选择要移交的接收人，确认移交后接收人将收到签收通知。</div>' +
    '</div></div>';

  html += '<div style="margin-bottom:12px"><h4 style="margin-bottom:8px">待移交接收人（' + pendingRecipients.length + '/' + d.recipients.length + '）</h4>';
  html += '<table style="font-size:12px"><thead><tr>' +
    '<th style="width:40px"><input type="checkbox" id="transferSelectAll" onchange="toggleTransferRecipients(\'' + distId + '\', this.checked)" style="width:16px;height:16px"></th>' +
    '<th>接收人</th><th>岗位</th><th>覆盖单位</th><th>覆盖人数</th><th>分配物资</th><th>状态</th>' +
    '</tr></thead><tbody>';

  d.recipients.forEach((r, idx) => {
    const isChecked = r.status === '待接收' ? 'checked' : '';
    const isDisabled = r.status !== '待接收' ? 'disabled' : '';
    const statusTag = r.status === '已接收' ? '<span class="tag tag-green">已签收</span>' :
                     r.status === '已移交' ? '<span class="tag tag-blue">已移交</span>' :
                     '<span class="tag tag-orange">待接收</span>';
    html += '<tr id="transfer-row-' + idx + '">' +
      '<td><input type="checkbox" class="transfer-checkbox" data-recipient-idx="' + idx + '" ' + isChecked + ' ' + isDisabled + ' style="width:16px;height:16px"></td>' +
      '<td><strong>' + r.name + '</strong></td>' +
      '<td>' + r.position + '</td>' +
      '<td>' + (r.units ? r.units.join('、') : '-') + '</td>' +
      '<td>' + (r.peopleCount || '-') + '人</td>' +
      '<td style="max-width:160px">' + (r.items || '待分配') + '</td>' +
      '<td>' + statusTag + '</td></tr>';
  });
  html += '</tbody></table></div>';

  openModal('发放人移交物资 - ' + d.id, html, [
    { text: '取消', class: 'btn-default', action: 'closeModal()' },
    { text: '确认移交', class: 'btn-primary', action: 'confirmTransfer(\'' + distId + '\')' }
  ]);
}

function toggleTransferRecipients(distId, checked) {
  const d = materialDistributions.find(x => x.id === distId);
  if (!d) return;
  d.recipients.forEach((r, idx) => {
    if (r.status === '待接收') {
      const cb = document.querySelector('.transfer-checkbox[data-recipient-idx="' + idx + '"]');
      if (cb) cb.checked = checked;
    }
  });
}

function confirmTransfer(distId) {
  const d = materialDistributions.find(x => x.id === distId);
  if (!d) return;

  const selectedIdxs = Array.from(document.querySelectorAll('.transfer-checkbox:checked')).map(cb => parseInt(cb.dataset.recipientIdx));
  if (selectedIdxs.length === 0) {
    alert('请至少选择一个接收人');
    return;
  }

  const now = new Date();
  const timeStr = now.toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });

  // 更新选中接收人的状态为"已移交"
  selectedIdxs.forEach(idx => {
    d.recipients[idx].status = '已移交';
    d.recipients[idx].transferTime = timeStr;
  });

  const step3 = d.workflowSteps.find(s => s.step === 3);
  step3.note = '已移交 ' + selectedIdxs.length + '/' + d.recipients.length + ' 人';

  // 检查是否所有接收人都已移交
  const allTransferred = d.recipients.every(r => r.status === '已移交' || r.status === '已接收');
  if (allTransferred) {
    step3.status = '已完成';
    step3.time = timeStr;
    d.currentStep = 4;
    const step4 = d.workflowSteps.find(s => s.step === 4);
    step4.status = '进行中';
    step4.note = '待所有接收人确认签收';
  }

  closeModal();
  alert('已移交 ' + selectedIdxs.length + ' 人！\n\n' +
    (allTransferred ? '所有接收人已移交，等待签收确认。' : '部分接收人已移交，可继续移交剩余人员。') +
    '\n\n接收人将收到待办通知：确认签收物资。');
  switchMatDistTab('active');
}

// 接收人签收
function confirmReceive(distId, recipientIdx) {
  const d = materialDistributions.find(x => x.id === distId);
  if (!d) return;

  const r = d.recipients[recipientIdx];
  if (r.status === '已接收') return;

  const now = new Date();
  const timeStr = now.toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });

  r.status = '已接收';
  r.receiveTime = timeStr;

  // 检查是否所有接收人都已签收
  const allReceived = d.recipients.every(rec => rec.status === '已接收');
  if (allReceived) {
    const step4 = d.workflowSteps.find(s => s.step === 4);
    step4.status = '已完成';
    step4.time = timeStr;
    step4.note = '所有接收人已签收';
    d.currentStep = 4;
    d.status = '已完成';
    alert('【接收人签收】全部完成！\n\n所有 ' + d.recipients.length + ' 位接收人已签收，物资发放流程结束。');
  } else {
    const receivedCount = d.recipients.filter(rec => rec.status === '已接收').length;
    alert(r.name + ' 已签收！\n\n还有 ' + (d.recipients.length - receivedCount) + ' 位接收人待签收。');
  }
  switchMatDistTab('active');
}

// 批量确认签收
function showBatchReceiveModal(distId) {
  const d = materialDistributions.find(x => x.id === distId);
  if (!d) return;

  const pendingRecipients = d.recipients.filter(r => r.status !== '已接收');
  let html = '<div style="margin-bottom:12px;font-size:13px;color:var(--text-secondary)">以下接收人待确认签收，可逐一确认或批量签收：</div>';

  html += '<table style="font-size:12px"><thead><tr><th>接收人</th><th>岗位</th><th>分配物资</th><th>状态</th><th>操作</th></tr></thead><tbody>';
  d.recipients.forEach((r, idx) => {
    const isReceived = r.status === '已接收';
    html += '<tr id="recv-row-' + idx + '">' +
      '<td><strong>' + r.name + '</strong></td>' +
      '<td>' + r.position + '</td>' +
      '<td style="max-width:160px">' + (r.items || '待分配') + '</td>' +
      '<td><span class="tag ' + (isReceived ? 'tag-green' : 'tag-orange') + '">' + r.status + '</span></td>' +
      '<td>' + (isReceived ? '<span style="color:var(--text-tertiary);font-size:11px">' + r.receiveTime + '</span>' :
        '<button class="btn btn-success btn-sm" onclick="confirmReceive(\'' + distId + '\', ' + idx + ');showBatchReceiveModal(\'' + distId + '\')">确认签收</button>') +
      '</td></tr>';
  });
  html += '</tbody></table>';

  const receivedCount = d.recipients.filter(r => r.status === '已接收').length;
  html += '<div style="margin-top:12px;padding:10px;background:var(--bg-page);border-radius:6px;font-size:13px">' +
    '<strong>签收进度：</strong>' + receivedCount + '/' + d.recipients.length + ' 人已签收' +
    '<div class="progress-bar" style="margin-top:6px"><div class="progress-fill ' + (receivedCount === d.recipients.length ? 'green' : 'blue') + '" style="width:' + Math.round(receivedCount/d.recipients.length*100) + '%"></div></div>' +
    '</div>';

  openModal('接收人签收 - ' + d.id, html, [
    { text: '关闭', class: 'btn-default', action: 'closeModal()' },
    { text: '全部签收', class: 'btn-primary', action: 'batchConfirmReceive(\'' + distId + '\')' }
  ]);
}

function batchConfirmReceive(distId) {
  const d = materialDistributions.find(x => x.id === distId);
  if (!d) return;

  const now = new Date();
  const timeStr = now.toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });

  // 批量签收所有待接收的接收人
  d.recipients.forEach(r => {
    if (r.status !== '已接收') {
      r.status = '已接收';
      r.receiveTime = timeStr;
    }
  });

  const step4 = d.workflowSteps.find(s => s.step === 4);
  if (step4) {
    step4.status = '已完成';
    step4.time = timeStr;
    step4.note = '所有接收人已签收';
  }
  d.currentStep = 4;
  d.status = '已完成';

  closeModal();
  alert('全部签收完成！\n\n所有 ' + d.recipients.length + ' 位接收人已签收，物资发放流程结束。');
  switchMatDistTab('completed');
}

// 审批通过物资发放
function approveDistribution(distId) {
  const d = materialDistributions.find(x => x.id === distId);
  if (!d) return;

  if (confirm('确认审批通过该物资发放申请？\n\n通过后将自动生成四步执行流程。')) {
    d.status = '已批准';
    d.workflowSteps = generateDistributionWorkflow(d);
    d.workflowSteps[0].status = '进行中';
    d.currentStep = 1;

    // 同步更新审批流程记录
    if (d.approvalId) {
      const wf = workflowRecords.find(w => w.id === d.approvalId);
      if (wf) { wf.status = '已批准'; wf.currentStep = wf.totalSteps; }
    }
    alert('已批准！四步执行流程已生成，第一步"仓库出库"已激活。');
    switchMatDistTab('active');
  }
}

  // 四步流程链
  html += '<div><h4 style="margin-bottom:8px">执行流程</h4>';

    const statusColor = s.status === '已完成' ? 'var(--success)' : s.status === '进行中' ? 'var(--primary)' : 'var(--text-tertiary)';

      '<div style="font-size:12px;color:var(--text-secondary)">负责人：' + s.assignee + '</div>' +
      '</div>' +
      '<div style="text-align:right">' +

  html += '</div>';

  openModal('物资发放详情 - ' + d.id, html, [
    { text: '关闭', class: 'btn-default', action: 'closeModal()' }
  ]);
}

// ============ 资产管理 ============
function renderAsset() {
  const inUse = assets.filter(a => a.status === 'in-use').length;
  const idle = assets.filter(a => a.status === 'idle').length;
  const repair = assets.filter(a => a.status === 'repair').length;
  const scrapped = assets.filter(a => a.status === 'scrapped').length;
  const totalValue = assets.reduce((sum, a) => sum + a.cost, 0);

  return `
    <div class="page-header">
      <h2>资产管理</h2>
      <p>公司资产全生命周期管理：采购入库→领用→维修→报废。</p>
    </div>

    <div class="stats-grid" style="margin-bottom:24px">
      <div class="stat-card">
        <div class="stat-icon blue">&#128188;</div>
        <div class="stat-info">
          <div class="stat-label">资产总数</div>
          <div class="stat-value">${assets.length}</div>
          <div class="stat-footer">原值 ${(totalValue/10000).toFixed(1)} 万元</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green">&#9989;</div>
        <div class="stat-info">
          <div class="stat-label">在用</div>
          <div class="stat-value">${inUse}</div>
          <div class="stat-footer">占比 ${Math.round(inUse/assets.length*100)}%</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon orange">&#128295;</div>
        <div class="stat-info">
          <div class="stat-label">维修中</div>
          <div class="stat-value">${repair}</div>
          <div class="stat-footer">闲置 ${idle} 台</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon red">&#128683;</div>
        <div class="stat-info">
          <div class="stat-label">已报废</div>
          <div class="stat-value">${scrapped}</div>
          <div class="stat-footer">待处理 ${idle} 台</div>
        </div>
      </div>
    </div>

    <div class="toolbar">
      <button class="btn btn-primary btn-sm" onclick="showAddAssetModal()">+ 新增资产</button>
      <select class="form-select" style="width:150px" onchange="filterAssets(this.value)">
        <option value="all">全部分类</option>
        <option value="vehicle">车辆</option>
        <option value="equipment">设备</option>
        <option value="tool">工具</option>
        <option value="office">办公用品</option>
      </select>
    </div>

    <div class="card">
      <div class="card-body no-padding">
        <table id="assetTable">
          <thead>
            <tr>
              <th>资产编号</th>
              <th>名称</th>
              <th>分类</th>
              <th>规格</th>
              <th>原值(元)</th>
              <th>状态</th>
              <th>存放位置</th>
              <th>负责人</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
            ${assets.map(a => {
              const cat = assetCategories.find(c => c.id === a.category);
              const statusInfo = assetStatusMap[a.status];
              return '<tr>' +
                '<td><strong>' + a.id + '</strong></td>' +
                '<td>' + cat.icon + ' ' + a.name + '</td>' +
                '<td>' + cat.name + '</td>' +
                '<td style="font-size:12px;color:var(--text-secondary)">' + a.spec + '</td>' +

                   a.status === 'repair' ? '<button class="btn btn-default btn-sm" onclick="changeAssetStatus(\'' + a.id + '\', \'idle\')">修完归还</button>' : '') +
                '</td></tr>';
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>`;

function filterAssets(category) {
  const rows = document.querySelectorAll('#assetTable tbody tr');
  rows.forEach(row => {
    if (category === 'all') {
      row.style.display = '';
    } else {
      const catName = assetCategories.find(c => c.id === category).name;
      row.style.display = row.textContent.includes(catName) ? '' : 'none';
    }
  });
}

    (a.assetTag ? '<div class="desc-item"><div class="desc-label">资产标签</div><div class="desc-value">' + a.assetTag + '</div></div>' : '') +
    '</div></div>';

  if (a.maintenanceRecords && a.maintenanceRecords.length > 0) {
    html += '<div><h4 style="margin-bottom:8px">维护/维修记录</h4>' +
      '<table style="font-size:12px"><thead><tr><th>日期</th><th>类型</th><th>费用</th><th>说明</th></tr></thead><tbody>' +
      a.maintenanceRecords.map(r => '<tr><td>' + r.date + '</td><td><span class="tag ' + (r.type === '维修' ? 'tag-orange' : r.type === '保养' ? 'tag-blue' : 'tag-red') + '">' + r.type + '</span></td>' +
        '<td style="text-align:right">' + (r.cost > 0 ? r.cost + ' 元' : '-') + '</td><td>' + r.desc + '</td></tr>').join('') +
      '</tbody></table></div>';
  }

  openModal('资产详情 - ' + a.name, html, [
    { text: '关闭', class: 'btn-default', action: 'closeModal()' }
  ]);
}

function changeAssetStatus(assetId, newStatus) {
  const a = assets.find(x => x.id === assetId);
  if (!a) return;
  const statusLabels = { 'idle': '闲置', 'in-use': '在用', 'repair': '维修中', 'scrapped': '已报废' };
  if (confirm('确认将资产 ' + a.name + ' 状态变更为【' + statusLabels[newStatus] + '】？')) {
    a.status = newStatus;
    if (newStatus === 'idle') a.location = '仓库';
    alert('资产状态已更新！');
    navigateTo('asset');
  }
}

function saveNewAsset() {
  const name = document.getElementById('newAssetName').value;
  const category = document.getElementById('newAssetCategory').value;
  const spec = document.getElementById('newAssetSpec').value;
  const cost = parseInt(document.getElementById('newAssetCost').value) || 0;
  const purchaseDate = document.getElementById('newAssetDate').value;
  const location = document.getElementById('newAssetLocation').value;
  const responsibleId = parseInt(document.getElementById('newAssetResponsible').value);
  const responsible = employees.find(e => e.id === responsibleId);

  if (!name || !cost || !purchaseDate) {
    alert('请填写完整信息');
    return;
  }

  const newId = 'AST-' + String(assets.length + 1).padStart(3, '0');
  assets.push({
    id: newId, name: name, category: category, spec: spec,
    purchaseDate: purchaseDate, cost: cost, depreciationMonths: 60,
    status: 'idle', location: location || '仓库', responsibleId: responsibleId, responsible: responsible.name,
    maintenanceRecords: [],
  });

  closeModal();
  alert('资产已添加！编号：' + newId);
  navigateTo('asset');
}

function switchWarehouseTab(tab) {
  document.querySelectorAll('#warehouseTabs .tab-item').forEach((el, i) => {
    const tabs = ['inventory', 'inbound', 'outbound'];
    el.classList.toggle('active', tabs[i] === tab);
  });
  const contentEl = document.getElementById('warehouseContent');
  switch(tab) {
    case 'inventory': contentEl.innerHTML = renderWarehouseInventory(); break;
    case 'inbound': contentEl.innerHTML = renderWarehouseInbound(); break;
    case 'outbound': contentEl.innerHTML = renderWarehouseOutbound(); break;
  }
}

    '<div class="desc-item"><div class="desc-label">物品名称</div><div class="desc-value">' + i.name + '</div></div>' +

    '</div>';

  if (relatedInbound.length > 0) {
    html += '<div style="margin-bottom:16px"><h4 style="margin-bottom:8px">入库记录</h4>' +
      '<table style="font-size:12px"><thead><tr><th>单号</th><th>日期</th><th>数量</th><th>状态</th></tr></thead><tbody>' +

function submitInbound() {
  const type = document.getElementById('inboundType').value;
  const supplier = document.getElementById('inboundSupplier').value;
  if (!supplier) { alert('请输入供应商名称'); return; }

  const rows = document.querySelectorAll('.inbound-item-row');
  const items = [];
  let totalCost = 0;
  rows.forEach(row => {
    const inputs = row.querySelectorAll('input');
    if (inputs[0].value) {
      const qty = parseInt(inputs[2].value) || 0;
      const cost = parseFloat(inputs[3].value) || 0;
      items.push({ name: inputs[0].value, spec: inputs[1].value, qty: qty, unit: '个', cost: cost, totalCost: qty * cost });
      totalCost += qty * cost;
    }
  });

  if (items.length === 0) { alert('请至少添加一项物品'); return; }

  const newId = 'IN-2026-' + String(inboundRecords.length + 1).padStart(3, '0');
  inboundRecords.unshift({
    id: newId, date: '2026-11-03', type: type, supplier: supplier,
    items: items, totalCost: totalCost, operator: '陈静', status: '待质检',
    qualityCheck: { inspector: '', result: '', note: '' },
  });

  closeModal();
  alert('入库单已提交！单号：' + newId + '\n请进行质检操作。');
  switchWarehouseTab('inbound');
}

function startQualityCheck(inboundId) {
  const r = inboundRecords.find(x => x.id === inboundId);
  if (!r) return;

  let html = '<div style="background:var(--primary-bg);border-radius:8px;padding:12px 16px;margin-bottom:16px">' +
    '<div style="font-weight:600;color:var(--primary);margin-bottom:4px">&#128269; 质检操作</div>' +
    '<div style="font-size:13px;color:var(--text-secondary)">入库单号：' + r.id + ' | 供应商：' + r.supplier + '</div></div>' +
    '<div class="form-item"><label>质检结果</label><select class="form-select" id="qcResult"><option value="合格">合格</option><option value="部分合格">部分合格</option><option value="不合格">不合格</option></select></div>' +
    '<div class="form-item"><label>质检员</label><input type="text" class="form-input" id="qcInspector" placeholder="请输入质检员姓名"></div>' +
    '<div class="form-item"><label>备注</label><textarea class="form-input" id="qcNote" rows="3" placeholder="请输入质检备注..."></textarea></div>';

  openModal('质检 - ' + r.id, html, [
    { text: '取消', class: 'btn-default', action: 'closeModal()' },
    { text: '确认质检', class: 'btn-primary', action: 'confirmQualityCheck(\'' + inboundId + '\')' }
  ]);
}

function confirmQualityCheck(inboundId) {
  const r = inboundRecords.find(x => x.id === inboundId);
  if (!r) return;

  const result = document.getElementById('qcResult').value;
  const inspector = document.getElementById('qcInspector').value;
  const note = document.getElementById('qcNote').value;

  if (!inspector) { alert('请输入质检员姓名'); return; }

  r.qualityCheck = { inspector: inspector, result: result, note: note };
  r.status = '已完成';

  // 更新库存
  r.items.forEach(item => {
    const inv = inventoryItems.find(i => i.id === item.inventoryId);
    if (inv) {
      inv.stock += item.qty;
      inv.lastInbound = '2026-11-03';
    }
  });

  closeModal();
  alert('质检完成！库存已更新。');
  switchWarehouseTab('inbound');
}

      '<input type="number" class="form-input outbound-qty" data-inventory-id="' + i.id + '" placeholder="0" style="height:34px" min="0" max="' + i.stock + '">' +
      '<div></div></div>';
  });

  html += '</div></div>';

  openModal('出库操作', html, [
    { text: '取消', class: 'btn-default', action: 'closeModal()' },
    { text: '确认出库', class: 'btn-primary', action: 'submitOutbound()' }
  ]);
}

function submitOutbound() {
  const type = document.getElementById('outboundType').value;
  const receiver = document.getElementById('outboundReceiver').value;
  if (!receiver) { alert('请输入接收人姓名'); return; }

  const items = [];
  document.querySelectorAll('.outbound-qty').forEach(input => {
    const qty = parseInt(input.value) || 0;
    if (qty > 0) {
      const invId = input.dataset.inventoryId;
      const inv = inventoryItems.find(i => i.id === invId);
      if (inv && qty <= inv.stock) {
        items.push({ inventoryId: invId, name: inv.name, spec: inv.spec, qty: qty, unit: inv.unit });
        inv.stock -= qty;
      }
    }
  });

  if (items.length === 0) { alert('请至少填写一项出库数量'); return; }

  const newId = 'OUT-2026-' + String(outboundRecords.length + 1).padStart(3, '0');
  outboundRecords.unshift({
    id: newId, date: '2026-11-03', type: type,
    items: items, operator: '陈静', receiver: receiver, status: '已完成',
  });

  closeModal();
  alert('出库完成！单号：' + newId);
  switchWarehouseTab('outbound');
}

// ============ 通知 ============
function renderNotifications() {
  const listEl = document.getElementById('notificationList');
  listEl.innerHTML = notifications.map(n => `
    <div class="notification-item ${!n.read ? 'unread' : ''}" onclick="readNotification(${n.id})">
      <div class="notif-title">${!n.read ? '&#128308; ' : ''}${n.title}</div>
      <div style="font-size:13px;color:var(--text-primary);margin:4px 0">${n.content}</div>
      <div class="notif-meta">
        <span>${n.sender}（${n.senderRole}）</span>
        <span>${n.date}</span>
        <span class="tag ${n.priority === '紧急' ? 'tag-red' : n.priority === '重要' ? 'tag-orange' : 'tag-blue'}" style="font-size:11px">${n.priority}</span>
      </div>
    </div>
  `).join('');
}

function toggleNotificationPanel() {
  document.getElementById('notificationPanel').classList.toggle('open');
}

function readNotification(id) {
  const n = notifications.find(x => x.id === id);
  if (n) {
    n.read = true;
    const unread = notifications.filter(x => !x.read).length;
    document.getElementById('notifBadge').textContent = unread;
    document.getElementById('notifBadge').style.display = unread > 0 ? 'block' : 'none';
    renderNotifications();
  }
}

// ============ 模态框 ============
function openModal(title, bodyHtml, buttons) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalFooter').innerHTML = buttons.map(b =>
    `<button class="btn ${b.class}" onclick="${b.action}">${b.text}</button>`
  ).join('');
  document.getElementById('modalOverlay').classList.add('active');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

function closeModalOutside(event) {
  if (event.target === document.getElementById('modalOverlay')) {
    closeModal();
  }
}

const MOBILE_SYNC_KEY = 'sanitation_ai_sync_v1';

function collectSyncPayload() {
  return {
    version: 1,
    savedAt: new Date().toISOString(),
    savedBy: (typeof currentUser !== 'undefined' && currentUser && currentUser.name) || 'web',
    employees: (typeof employees !== 'undefined') ? employees : [],
    vehicles: (typeof vehicles !== 'undefined') ? vehicles : [],
    workZones: (typeof workZones !== 'undefined') ? workZones : [],
    personnelWorkAreas: (typeof personnelWorkAreas !== 'undefined') ? personnelWorkAreas : [],
    snowZones: (typeof snowZones !== 'undefined') ? snowZones : [],
    tasks: (typeof tasks !== 'undefined') ? tasks : [],
    alerts: (typeof alerts !== 'undefined') ? alerts : [],
    checkins: (typeof checkins !== 'undefined') ? checkins : [],
    reports: (typeof reports !== 'undefined') ? reports : [],
    attendance: (typeof attendance !== 'undefined') ? attendance : []
  };
}
function readSyncPayload() {
  try { const raw = localStorage.getItem(MOBILE_SYNC_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
function pushToMobile() {
  const p = collectSyncPayload();
  try {
    localStorage.setItem(MOBILE_SYNC_KEY, JSON.stringify(p));
    showToast('已推送到本地存储，手机端刷新即可读取');
    navigateTo('mobile-sync');
    return true;
  } catch (e) { alert('写入 localStorage 失败：' + e.message); return false; }
}
function pullFromMobile() {
  const d = readSyncPayload();
  if (!d) { showToast('未检测到手机端保存的数据'); return; }
  const keys = ['employees','vehicles','workZones','personnelWorkAreas','snowZones','tasks','alerts','checkins','reports','attendance'];
  let applied = 0;
  keys.forEach(k => {
    if (Array.isArray(d[k]) && d[k].length && typeof window[k] !== 'undefined') {
      try {
        const target = eval(k);
        if (Array.isArray(target)) { target.length = 0; d[k].forEach(x => target.push(x)); applied++; }
      } catch (e) {}
    }
  });
  showToast('已从手机端拉取，覆盖 ' + applied + ' 个数据表');
  navigateTo('mobile-sync');
}
function exportSyncJSON() {
  const p = collectSyncPayload();
  const blob = new Blob([JSON.stringify(p, null, 2)], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'sanitation-sync-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast('已导出同步文件');
}
function importSyncJSON() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const d = JSON.parse(rd.result);
        localStorage.setItem(MOBILE_SYNC_KEY, JSON.stringify(d));
        const keys = ['employees','vehicles','workZones','personnelWorkAreas','snowZones','tasks','alerts','checkins','reports','attendance'];
        let applied = 0;
        keys.forEach(k => {
          if (Array.isArray(d[k]) && d[k].length) {
            try { const target = eval(k); if (Array.isArray(target)) { target.length = 0; d[k].forEach(x => target.push(x)); applied++; } } catch (e) {}
          }
        });
        showToast('导入成功，已覆盖 ' + applied + ' 个数据表');
        navigateTo('mobile-sync');
      } catch (e) { alert('JSON 解析失败：' + e.message); }
    };
    rd.readAsText(f, 'utf-8');
  };
  inp.click();
}
function clearSyncStorage() {
  if (!confirm('确认清除本地同步数据？网页版内存数据不受影响。')) return;
  try { localStorage.removeItem(MOBILE_SYNC_KEY); showToast('已清除'); navigateTo('mobile-sync'); } catch (e) {}
}
function openMobilePage() {

        · 跨设备（如手机扫码访问）：请先点击"导出 JSON"下载文件，再通过手机端"导入 JSON"上传。<br>
        · 若使用 file:// 协议，浏览器不共享 localStorage，请使用 JSON 导出/导入方式。

const CHAT_STORE_KEY = 'sanitation_chats_v1';
function loadAllChats() {
  try { const raw = localStorage.getItem(CHAT_STORE_KEY); return raw ? JSON.parse(raw) : {}; } catch (e) { return {}; }
}
function saveAllChats(all) {
  try { localStorage.setItem(CHAT_STORE_KEY, JSON.stringify(all)); } catch (e) { console.warn('聊天记录保存失败', e); }
}
function chatKeyFor(a, b) {
  const x = String(a), y = String(b);
  return 'chat_' + (x < y ? x + '__' + y : y + '__' + x);
}
function getChatMessages(otherName) {
  const selfName = (currentUser && currentUser.name) || '我';
  const all = loadAllChats();
  const k = chatKeyFor(selfName, otherName);
  if (!all[k]) all[k] = [];
  return all[k];
}
function appendChatMessage(otherName, msg) {
  const selfName = (currentUser && currentUser.name) || '我';
  const all = loadAllChats();
  const k = chatKeyFor(selfName, otherName);
  if (!all[k]) all[k] = [];
  all[k].push(msg);
  saveAllChats(all);
}

// ---------- 组织架构扁平化 & 节点操作 ----------
function walkOrg(node, path, out) {
  out = out || [];
  const cur = { id: node.id || ('root_' + out.length), name: node.name, type: node.type || 'department', desc: node.desc || '', headcount: node.headcount, path: path.concat([node.name]), node: node };
  out.push(cur);
  if (Array.isArray(node.children)) node.children.forEach(c => walkOrg(c, cur.path, out));
  return out;
}
function flatOrg() { return walkOrg(organizationData, [], []); }
function findOrgNode(id) {
  function rec(n) {
    if (n.id === id) return n;
    if (Array.isArray(n.children)) for (const c of n.children) { const r = rec(c); if (r) return r; }
    return null;
  }
  return rec(organizationData);
}
function findOrgParent(id, parent) {
  parent = parent || organizationData;
  if (Array.isArray(parent.children)) {
    for (const c of parent.children) {
      if (c.id === id) return parent;
      const r = findOrgParent(id, c);
      if (r) return r;
    }
  }
  return null;
}
function membersOfOrgPath(pathArr) {
  if (!pathArr || !pathArr.length) return employees.slice();
  const leaf = pathArr[pathArr.length - 1];
  if (leaf === organizationData.name) return employees.slice();
  return employees.filter(e => pathArr.some(p => (e.department || '').indexOf(p) >= 0 || (e.position || '').indexOf(p) >= 0));
}
function countMembersUnder(id) {
  const n = findOrgNode(id);
  if (!n) return 0;
  const arr = walkOrg(n, [], []);
  const names = arr.map(x => x.name);
  return employees.filter(e => names.some(nm => (e.department || '').indexOf(nm) >= 0 || (e.position || '').indexOf(nm) >= 0)).length;
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function filterMembers(list, kw) {
  kw = String(kw || '').trim().toLowerCase();
  if (!kw) return list;
  return list.filter(e => ((e.name || '') + (e.position || '') + (e.department || '') + (e.phone || '')).toLowerCase().indexOf(kw) >= 0);
}
function renderOrgTree(node, canEdit, depth) {
  const st = window.__contactsState;
  const id = node.id || ('root_' + depth);
  if (depth === 0 && !node.id) node.id = 'root_0';
  const hasChildren = Array.isArray(node.children) && node.children.length > 0;
  const expanded = depth === 0 ? true : !!st.expanded[id];
  const active = st.selectedOrgId === id;
  const cnt = countMembersUnder(id);
  const ico = node.type === 'position' ? '👤' : (depth === 0 ? '🏢' : '📁');
  let html = '<div class="org-node' + (active ? ' active' : '') + '" onclick="selectOrgNode(\'' + id + '\', ' + (hasChildren ? 1 : 0) + ')">'
    + (hasChildren ? '<span class="arrow' + (expanded ? ' expanded' : '') + '">▶</span>' : '<span class="arrow"></span>')
    + '<span class="ico">' + ico + '</span>'
    + '<span>' + esc(node.name) + '</span>'
    + '<span class="cnt">' + cnt + '</span>'
    + (canEdit && depth > 0 ? '<span class="org-actions" onclick="event.stopPropagation()">'
        + '<button title="新增子级" onclick="openOrgCreate(\'' + id + '\')">＋</button>'
        + '<button title="编辑" onclick="openOrgEdit(\'' + id + '\')">✎</button>'
        + '<button title="删除" onclick="confirmOrgDelete(\'' + id + '\')">🗑</button>'
      + '</span>' : '')
    + '</div>';
  if (hasChildren && expanded) {
    html += '<div class="org-children">';
    node.children.forEach(c => { html += renderOrgTree(c, canEdit, depth + 1); });
    html += '</div>';
  }
  return html;
}
function selectOrgNode(id, hasChildren) {
  const st = window.__contactsState;
  st.selectedOrgId = id;
  if (hasChildren) st.expanded[id] = !st.expanded[id];
  navigateTo('contacts');
}
function rerenderContactsMain() {
  const st = window.__contactsState;

}

function exportContactsCSV() {
  const st = window.__contactsState;
  const all = flatOrg();
  const selNode = all.find(x => x.id === st.selectedOrgId) || all[0];
  const list = filterMembers(membersOfOrgPath(selNode ? selNode.path : []), st.keyword);
  const header = ['工号','姓名','性别','岗位','部门','电话','邮箱','状态','APP账号','最近登录'];
  const rows = list.map(e => [
    String(e.id).padStart(4,'0'), e.name, e.gender || '-', e.position, e.department,
    e.phone || '-', e.email || '-', e.status || '-', e.account || '-',
    e.lastLogin ? new Date(e.lastLogin).toLocaleString('zh-CN',{hour12:false}) : '从未登录'
  ]);
  const csv = '\uFEFF' + [header].concat(rows).map(r => r.map(x => '"' + String(x).replace(/"/g, '""') + '"').join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '通讯录-' + (selNode ? selNode.name : '全部') + '-' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('已导出 ' + list.length + ' 位成员');
}

  openModal('编辑机构 / 岗位 - ' + n.name, ''
    + '<div class="form-item"><label class="form-label">类型</label><select class="form-select" id="oe-type"><option value="department" ' + (n.type !== 'position' ? 'selected' : '') + '>机构（部门）</option><option value="position" ' + (n.type === 'position' ? 'selected' : '') + '>岗位（职务）</option></select></div>'
    + '<div class="form-item"><label class="form-label">名称 <span style="color:var(--danger)">*</span></label><input type="text" class="form-input" id="oe-name" value="' + esc(n.name) + '"></div>'
    + '<div class="form-item"><label class="form-label">编制人数</label><input type="text" class="form-input" id="oe-headcount" value="' + esc(n.headcount || '') + '"></div>'
    + '<div class="form-item"><label class="form-label">职责说明</label><textarea class="form-input" id="oe-desc" rows="3">' + esc(n.desc || '') + '</textarea></div>',
    [{ text: '取消', class: 'btn-default', action: 'closeModal()' },
     { text: '保存', class: 'btn-primary', action: 'saveOrgEdit(\'' + id + '\')' }]);
}
function saveOrgEdit(id) {
  const n = findOrgNode(id);
  if (!n) return;
  const name = (document.getElementById('oe-name').value || '').trim();
  if (!name) { alert('名称不能为空'); return; }
  n.type = document.getElementById('oe-type').value;
  n.name = name;
  n.headcount = (document.getElementById('oe-headcount').value || '').trim() || undefined;
  n.desc = (document.getElementById('oe-desc').value || '').trim() || undefined;
  closeModal();
  showToast('已保存');
  navigateTo('contacts');
}
function confirmOrgDelete(id) {
  const n = findOrgNode(id);
  if (!n) return;
  const cnt = countMembersUnder(id);
  openModal('删除确认', '<div class="alert alert-warning">⚠️ 即将删除 <b>' + esc(n.name) + '</b>' + (cnt ? '，其下关联 <b>' + cnt + '</b> 名成员（成员不会被删除，仅解除关联）' : '') + '。<br>此操作不可撤销，确认继续？</div>', [
    { text: '取消', class: 'btn-default', action: 'closeModal()' },
    { text: '确认删除', class: 'btn-danger', action: 'doOrgDelete(\'' + id + '\')' }
  ]);
}
function doOrgDelete(id) {
  const parent = findOrgParent(id);
  if (!parent || !Array.isArray(parent.children)) { alert('无法删除根节点'); return; }
  const idx = parent.children.findIndex(c => c.id === id);
  if (idx < 0) return;
  const removed = parent.children.splice(idx, 1)[0];
  closeModal();
  showToast('已删除：' + removed.name);
  navigateTo('contacts');
}

// ============ 微信风格对话窗 ============
let __chatState = { otherName: null, recording: false, mediaRecorder: null, audioChunks: [], recordStart: 0, autoReplyTimer: null };
const EMOJI_LIST = ['😀','😁','😂','🤣','😊','😍','😘','😎','🤔','😴','😭','😡','👍','👎','👌','🙏','💪','👏','🤝','❤️','💔','🎉','🎂','🌹','🌞','🌙','⭐','🔥','💯','✅','❌','⚠️','📞','📷','📁','🚗','🧹','❄️'];

function openChatModal(otherName) {
  const other = employees.find(e => e.name === otherName) || { name: otherName, position: '', department: '', phone: '' };
  __chatState.otherName = otherName;
  const initial = (other.name || '').slice(-2);
  const hdr = document.getElementById('chatHdr');
  hdr.innerHTML = ''
    + '<div class="avatar">' + esc(initial) + '</div>'
    + '<div class="info"><div class="name">' + esc(other.name) + '</div><div class="sub">' + esc(other.position || '') + (other.department ? ' · ' + esc(other.department) : '') + (other.phone ? ' · 📞' + esc(other.phone) : '') + '</div></div>'
    + '<div class="actions">'
    +   '<button title="拨打电话" onclick="callMember(\'' + String(other.phone || '').replace(/'/g,'') + '\',\'' + String(other.name).replace(/'/g,'') + '\')">📞</button>'
    +   '<button title="查看详情" onclick="showEmployeeDetail(' + (other.id || 0) + ')">👁</button>'
    +   '<button title="清空记录" onclick="clearChatHistory()">🗑</button>'
    +   '<button title="关闭" class="close" onclick="closeChatModal()">✕</button>'
    + '</div>';
  const tools = document.getElementById('chatTools');
  tools.innerHTML = ''
    + '<button class="tool-btn" title="表情" onclick="toggleEmojiPanel()">😊</button>'
    + '<button class="tool-btn" title="语音（点击开始/停止录音）" id="voiceBtn" onclick="toggleVoiceRecord()">🎤</button>'
    + '<button class="tool-btn" title="发送图片" onclick="document.getElementById(\'chatImageInput\').click()">🖼</button>'
    + '<button class="tool-btn" title="发送文件" onclick="document.getElementById(\'chatFileInput\').click()">📁</button>'
    + '<button class="tool-btn" title="屏幕截图" onclick="captureScreenshot()">📷</button>'
    + '<button class="tool-btn" title="位置" onclick="sendQuickSystem(\'分享了当前位置：项目现场\')">📍</button>'
    + '<button class="tool-btn" title="视频通话（演示）" onclick="sendQuickSystem(\'发起了视频通话（演示环境不支持真实通话）\')">📹</button>'
    + '<span style="margin-left:auto;font-size:11px;color:#999;align-self:center">对方：' + esc(other.name) + '</span>';
  const emojiPanel = document.getElementById('emojiPanel');
  emojiPanel.innerHTML = EMOJI_LIST.map(e => '<span onclick="insertEmoji(\'' + e + '\')">' + e + '</span>').join('');
  emojiPanel.classList.remove('active');
  const input = document.getElementById('chatInput');
  input.value = '';
  input.onkeydown = (ev) => {
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); sendChatMessage(); }
  };
  input.oninput = () => { input.style.height = 'auto'; input.style.height = Math.min(100, input.scrollHeight) + 'px'; };
  document.getElementById('chatModal').classList.add('active');
  renderChatBody();
  setTimeout(() => input.focus(), 100);
}
function closeChatModal() {
  if (__chatState.recording) stopVoiceRecord(true);
  document.getElementById('chatModal').classList.remove('active');
  document.getElementById('emojiPanel').classList.remove('active');
  if (__chatState.autoReplyTimer) { clearTimeout(__chatState.autoReplyTimer); __chatState.autoReplyTimer = null; }
  __chatState.otherName = null;
}
function closeChatOutside(ev) { if (ev.target && ev.target.id === 'chatModal') closeChatModal(); }

function renderChatBody() {
  const body = document.getElementById('chatBody');
  if (!body || !__chatState.otherName) return;
  const msgs = getChatMessages(__chatState.otherName);
  if (!msgs.length) {
    body.innerHTML = '<div style="text-align:center;color:#999;padding:60px 20px;font-size:13px">💬 暂无对话记录<br><span style="font-size:11.5px">发送第一条消息开始沟通，支持文字/语音/图片/文件/截图/表情</span></div>';
    return;
  }
  const selfName = (currentUser && currentUser.name) || '我';
  let html = '';
  let lastTime = 0;
  msgs.forEach(m => {
    const t = new Date(m.time).getTime();
    if (t - lastTime > 5 * 60 * 1000) {
      html += '<div class="chat-time"><span>' + formatChatTime(m.time) + '</span></div>';
      lastTime = t;
    }
    const isSelf = m.from === 'self';
    const who = isSelf ? selfName : __chatState.otherName;
    const initial = String(who).slice(-2);
    html += '<div class="chat-msg' + (isSelf ? ' self' : '') + '">'
      + '<div class="m-avatar">' + esc(initial) + '</div>'
      + '<div class="m-content">'
      +   '<div class="m-name">' + esc(who) + '</div>'
      +   renderBubble(m)
      +   (isSelf ? '<div class="msg-status">' + (m.status === 'read' ? '✓✓ 已读' : '✓ 已发送') + '</div>' : '')
      + '</div>'
      + '</div>';
  });
  body.innerHTML = html;
  body.scrollTop = body.scrollHeight;
}
function renderBubble(m) {
  if (m.type === 'text') return '<div class="bubble">' + esc(m.content) + '</div>';
  if (m.type === 'emoji') return '<div class="bubble emoji">' + esc(m.content) + '</div>';
  if (m.type === 'system') return '<div class="bubble system">' + esc(m.content) + '</div>';
  if (m.type === 'voice') {
    const dur = (m.meta && m.meta.duration) || 0;
    const w = Math.min(240, 60 + dur * 12);
    return '<div class="bubble voice" style="width:' + w + 'px" onclick="playVoiceMessage(\'' + m.id + '\')">'
      + '<span class="v-ico">🔊</span>'
      + '<div class="v-bar"><div class="v-bar-fill" id="vf-' + m.id + '"></div></div>'
      + '<span class="v-dur">' + dur + '″</span>'
      + (m.content ? '<audio id="au-' + m.id + '" src="' + m.content + '" preload="metadata" style="display:none"></audio>' : '')
      + '</div>';
  }
  if (m.type === 'image') {
    return '<div class="bubble image" onclick="previewImage(\'' + m.id + '\')"><img id="img-' + m.id + '" src="' + m.content + '" alt="图片"></div>';
  }
  if (m.type === 'file') {
    const meta = m.meta || {};
    return '<div class="bubble file">'
      + '<div class="f-ico">' + fileIcon(meta.fileName || '') + '</div>'
      + '<div class="f-info"><div class="f-name">' + esc(meta.fileName || '文件') + '</div><div class="f-size">' + formatFileSize(meta.fileSize || 0) + '</div></div>'
      + '<a class="f-dl" href="' + m.content + '" download="' + esc(meta.fileName || 'file') + '">下载</a>'
      + '</div>';
  }
  return '<div class="bubble">' + esc(m.content || '') + '</div>';
}
function fileIcon(name) {
  const ext = String(name).split('.').pop().toLowerCase();
  if (['xls','xlsx','csv'].indexOf(ext) >= 0) return '📊';
  if (['doc','docx'].indexOf(ext) >= 0) return '📄';
  if (['pdf'].indexOf(ext) >= 0) return '📕';
  if (['ppt','pptx'].indexOf(ext) >= 0) return '📽';
  if (['zip','rar','7z'].indexOf(ext) >= 0) return '🗜';
  if (['mp3','wav','ogg'].indexOf(ext) >= 0) return '🎵';
  if (['mp4','avi','mov'].indexOf(ext) >= 0) return '🎬';
  return '📎';
}
function formatFileSize(b) {
  if (!b) return '0 B';
  if (b < 1024) return b + ' B';
  if (b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
  return (b/1024/1024).toFixed(2) + ' MB';
}
function formatChatTime(iso) {
  const d = new Date(iso);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  if (sameDay) return hh + ':' + mm;
  return (d.getMonth()+1) + '-' + d.getDate() + ' ' + hh + ':' + mm;
}

// ---------- 发送：文字 / 表情 ----------
function sendChatMessage() {
  const input = document.getElementById('chatInput');
  const text = (input.value || '').trim();
  if (!text || !__chatState.otherName) return;
  const isOnlyEmoji = /^[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\s]+$/u.test(text) && text.replace(/\s/g,'').length <= 8;
  appendChatMessage(__chatState.otherName, {
    id: 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
    from: 'self', type: isOnlyEmoji ? 'emoji' : 'text', content: text,
    time: new Date().toISOString(), status: 'sent'
  });
  input.value = ''; input.style.height = 'auto';
  renderChatBody();
  scheduleAutoReply(text);
}
function insertEmoji(e) {
  const input = document.getElementById('chatInput');
  input.value = (input.value || '') + e;
  input.focus();
}
function toggleEmojiPanel() {
  document.getElementById('emojiPanel').classList.toggle('active');
}
function sendQuickSystem(text) {
  if (!__chatState.otherName) return;
  appendChatMessage(__chatState.otherName, {
    id: 'm_' + Date.now(), from: 'self', type: 'system', content: text,
    time: new Date().toISOString(), status: 'sent'
  });
  renderChatBody();
}

// ---------- 发送：语音录制 ----------
function toggleVoiceRecord() {
  if (__chatState.recording) stopVoiceRecord(false);
  else startVoiceRecord();
}
function startVoiceRecord() {
  const btn = document.getElementById('voiceBtn');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
    alert('当前浏览器不支持录音 API。\n\n请使用 Chrome / Edge 最新版并允许麦克风权限。\n提示：file:// 协议下部分浏览器会拒绝麦克风，建议通过 http:// 本地服务器访问。');
    sendQuickSystem('尝试录制语音（当前环境不支持，已降级为文字提示）');
    return;
  }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    __chatState.recording = true;
    __chatState.audioChunks = [];
    __chatState.recordStart = Date.now();
    __chatState.mediaRecorder = new MediaRecorder(stream);
    __chatState.mediaRecorder.ondataavailable = e => { if (e.data.size) __chatState.audioChunks.push(e.data); };
    __chatState.mediaRecorder.onstop = () => {
      const blob = new Blob(__chatState.audioChunks, { type: 'audio/webm' });
      const dur = Math.max(1, Math.round((Date.now() - __chatState.recordStart) / 1000));
      stream.getTracks().forEach(t => t.stop());
      if (dur < 1) { showToast('录音时间太短'); return; }
      const reader = new FileReader();
      reader.onload = () => {
        if (!__chatState.otherName) return;
        appendChatMessage(__chatState.otherName, {
          id: 'm_' + Date.now(), from: 'self', type: 'voice',
          content: reader.result, meta: { duration: dur, mimeType: 'audio/webm' },
          time: new Date().toISOString(), status: 'sent'
        });
        renderChatBody();
        scheduleAutoReply('[语音消息 ' + dur + '″]');
      };
      reader.readAsDataURL(blob);
    };
    __chatState.mediaRecorder.start();
    btn.classList.add('recording');
    btn.textContent = '⏹';
    btn.title = '点击停止录音';
    showToast('🎤 正在录音...');
  }).catch(err => {
    alert('麦克风权限被拒绝：' + err.message + '\n\n请在浏览器地址栏左侧的锁形图标中允许麦克风权限。');
  });
}
function stopVoiceRecord(cancel) {
  if (!__chatState.recording) return;
  __chatState.recording = false;
  const btn = document.getElementById('voiceBtn');
  if (btn) { btn.classList.remove('recording'); btn.textContent = '🎤'; btn.title = '语音'; }
  try { if (cancel) __chatState.mediaRecorder.onstop = null; __chatState.mediaRecorder.stop(); } catch(e){}
}
function playVoiceMessage(id) {
  const au = document.getElementById('au-' + id);
  const bar = document.getElementById('vf-' + id);
  if (!au) { showToast('语音不可用（演示环境）'); return; }
  if (!au.paused) { au.pause(); au.currentTime = 0; if (bar) bar.style.width = '0%'; return; }
  au.play().catch(e => showToast('无法播放：' + e.message));
  au.ontimeupdate = () => { if (bar && au.duration) bar.style.width = (au.currentTime / au.duration * 100) + '%'; };
  au.onended = () => { if (bar) bar.style.width = '0%'; };
}

// ---------- 发送：图片 / 文件 ----------
function handleChatFilePicked(ev) {
  const file = ev.target.files && ev.target.files[0];
  if (!file || !__chatState.otherName) { ev.target.value = ''; return; }
  if (file.size > 8 * 1024 * 1024) { alert('文件大小超过 8MB，请压缩后再发送（演示环境限制）'); ev.target.value = ''; return; }
  const reader = new FileReader();
  reader.onload = () => {
    const isImage = file.type.indexOf('image/') === 0;
    appendChatMessage(__chatState.otherName, {
      id: 'm_' + Date.now(), from: 'self', type: isImage ? 'image' : 'file',
      content: reader.result,
      meta: { fileName: file.name, fileSize: file.size, mimeType: file.type },
      time: new Date().toISOString(), status: 'sent'
    });
    renderChatBody();
    scheduleAutoReply(isImage ? '[图片]' : '[文件] ' + file.name);
  };
  reader.readAsDataURL(file);
  ev.target.value = '';
}
function previewImage(id) {
  const img = document.getElementById('img-' + id);
  if (!img) return;
  document.getElementById('imgPreviewEl').src = img.src;
  document.getElementById('imgPreviewModal').classList.add('active');
}

// ---------- 发送：屏幕截图 ----------
function captureScreenshot() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
    alert('当前浏览器不支持屏幕截图 API。\n\n替代方案：\n(1) 使用系统截图工具（Win+Shift+S / Cmd+Shift+4）\n(2) 复制截图后回到对话框按 Ctrl+V 粘贴\n(3) 或点击工具栏 🖼 图标选择本地图片文件发送');
    return;
  }
  navigator.mediaDevices.getDisplayMedia({ video: true, preferCurrentTab: true }).then(stream => {
    const track = stream.getVideoTracks()[0];
    const video = document.createElement('video');
    video.srcObject = stream;
    video.onloadedmetadata = () => {
      video.play();
      setTimeout(() => {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        const dataUrl = canvas.toDataURL('image/png');
        try { track.stop(); } catch(e){}
        stream.getTracks().forEach(t => { try { t.stop(); } catch(e){} });
        if (!__chatState.otherName) return;
        appendChatMessage(__chatState.otherName, {
          id: 'm_' + Date.now(), from: 'self', type: 'image',
          content: dataUrl,
          meta: { fileName: 'screenshot-' + Date.now() + '.png', mimeType: 'image/png', isScreenshot: true },
          time: new Date().toISOString(), status: 'sent'
        });
        renderChatBody();
        showToast('📷 截图已发送');
        scheduleAutoReply('[屏幕截图]');
      }, 300);
    };
  }).catch(err => {
    if (err && err.name !== 'NotAllowedError') alert('截图失败：' + err.message);
  });
}

// 粘贴截图支持（Ctrl+V）
document.addEventListener('paste', (ev) => {
  if (!__chatState.otherName) return;
  const items = ev.clipboardData && ev.clipboardData.items;
  if (!items) return;
  for (const it of items) {
    if (it.type && it.type.indexOf('image/') === 0) {
      const file = it.getAsFile();
      if (!file) continue;
      const reader = new FileReader();
      reader.onload = () => {
        if (!__chatState.otherName) return;
        appendChatMessage(__chatState.otherName, {
          id: 'm_' + Date.now(), from: 'self', type: 'image',
          content: reader.result,
          meta: { fileName: 'paste-' + Date.now() + '.png', mimeType: file.type, isPaste: true },
          time: new Date().toISOString(), status: 'sent'
        });
        renderChatBody();
        showToast('已发送粘贴的图片');
        scheduleAutoReply('[图片]');
      };
      reader.readAsDataURL(file);
      ev.preventDefault();
      return;
    }
  }
});

// ---------- 清空 / 自动回复 ----------
function clearChatHistory() {
  if (!__chatState.otherName) return;
  if (!confirm('确认清空与 ' + __chatState.otherName + ' 的全部对话记录？')) return;
  const all = loadAllChats();
  const selfName = (currentUser && currentUser.name) || '我';
  delete all[chatKeyFor(selfName, __chatState.otherName)];
  saveAllChats(all);
  renderChatBody();
  showToast('对话记录已清空');
}
function scheduleAutoReply(userText) {
  if (__chatState.autoReplyTimer) clearTimeout(__chatState.autoReplyTimer);
  const otherName = __chatState.otherName;
  __chatState.autoReplyTimer = setTimeout(() => {
    if (!otherName) return;
    const replies = [
      '收到，我马上处理。',
      '好的，稍后回复您。',
      '明白了，谢谢通知。',
      '已在现场，稍等片刻。',
      '我这就安排人员过去。',
      '请补充一下具体位置和时间。',
      '已记录，会尽快跟进。'
    ];
    const reply = replies[Math.floor(Math.random() * replies.length)];
    appendChatMessage(otherName, {
      id: 'm_' + Date.now(), from: 'other', type: 'text', content: reply,
      time: new Date().toISOString(), status: 'read'
    });
    const all = loadAllChats();
    const selfName = (currentUser && currentUser.name) || '我';
    const k = chatKeyFor(selfName, otherName);
    if (all[k]) { all[k].forEach(m => { if (m.from === 'self') m.status = 'read'; }); saveAllChats(all); }
    if (__chatState.otherName === otherName) renderChatBody();
  }, 1200 + Math.random() * 1200);
}
